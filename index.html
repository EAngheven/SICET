<style>

:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F4F8;--surf:#FFFFFF;--ink:#16202B;--mut:#58677A;--line:#D5DDE6;--soft:#E6EDF4;
  --brand:#0F4D5C;--on-brand:#FFFFFF;--focus:#2B6CB0;
  --P:#12806A;--R:#B87400;--F:#BF3535;--J:#4F63B5;
  --Ps:color-mix(in srgb,var(--P) 15%,var(--surf));--Rs:color-mix(in srgb,var(--R) 18%,var(--surf));--Fs:color-mix(in srgb,var(--F) 15%,var(--surf));--Js:color-mix(in srgb,var(--J) 15%,var(--surf));--on:#FFFFFF;
  --shadow:0 1px 2px rgba(20,35,55,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D;--surf:#16202B;--ink:#E6ECF2;--mut:#9BAABA;--line:#2A3846;--soft:#1F2C3A;
    --brand:#3C9DB2;--on-brand:#06181D;--focus:#79B3E6;
    --P:#3CC4A5;--R:#E3A62B;--F:#F07878;--J:#93A5EA;
    --Ps:color-mix(in srgb,var(--P) 24%,var(--surf));--Rs:color-mix(in srgb,var(--R) 24%,var(--surf));--Fs:color-mix(in srgb,var(--F) 24%,var(--surf));--Js:color-mix(in srgb,var(--J) 24%,var(--surf));--on:#0B1117;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D;--surf:#16202B;--ink:#E6ECF2;--mut:#9BAABA;--line:#2A3846;--soft:#1F2C3A;
  --brand:#3C9DB2;--on-brand:#06181D;--focus:#79B3E6;
  --P:#3CC4A5;--R:#E3A62B;--F:#F07878;--J:#93A5EA;
  --Ps:color-mix(in srgb,var(--P) 24%,var(--surf));--Rs:color-mix(in srgb,var(--R) 24%,var(--surf));--Fs:color-mix(in srgb,var(--F) 24%,var(--surf));--Js:color-mix(in srgb,var(--J) 24%,var(--surf));--on:#0B1117;--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);font-size:calc(15px*var(--fs,1));line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:calc(22px*var(--fs,1));font-weight:700}
h3{font-size:calc(16px*var(--fs,1));font-weight:700}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand);color:var(--on-brand);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:14px}
.brand b{display:block;font-size:calc(16px*var(--fs,1));line-height:1.25}
.brand small{opacity:.8;font-size:calc(13px*var(--fs,1))}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500;opacity:.88}
#nav button:hover{background:rgba(255,255,255,.12);opacity:1}
#nav button[aria-current="page"]{background:rgba(255,255,255,.2);font-weight:700;opacity:1}
.sidefoot{margin-top:auto;font-size:calc(12.5px*var(--fs,1));opacity:.85}
main{padding:22px clamp(14px,3vw,34px) 60px;min-width:0;max-width:1280px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.head p{margin:2px 0 0;color:var(--mut)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surf);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.danger{color:var(--F);border-color:var(--F)}
.btn.sm{padding:4px 10px;font-size:calc(13px*var(--fs,1))}
.btn[disabled]{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none;display:inline-block}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.filters label,.form label{display:flex;flex-direction:column;gap:3px;font-size:calc(13px*var(--fs,1));color:var(--mut);font-weight:500}
.filters .nav{display:flex;align-items:flex-end;gap:6px}
.plabel{font-weight:600;color:var(--ink);align-self:center;margin-left:auto}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=checkbox]{width:18px;height:18px;padding:0}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.panel>h3{padding:12px 14px 0}
.panel .sub{padding:2px 14px 10px;color:var(--mut);font-size:calc(13px*var(--fs,1));margin:0}
.panel .body{padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surf);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.stat{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat span{display:block;color:var(--mut);font-size:calc(13px*var(--fs,1));font-weight:500}
.stat b{display:block;font-size:calc(28px*var(--fs,1));font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat small{color:var(--mut);font-size:calc(12.5px*var(--fs,1))}
.stat.big b{font-size:calc(34px*var(--fs,1))}
.cP{color:var(--P)}.cR{color:var(--R)}.cF{color:var(--F)}.cJ{color:var(--J)}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:calc(14px*var(--fs,1))}
th,td{padding:var(--cpy,8px) 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
thead th{background:var(--soft);font-weight:600;color:var(--mut);font-size:calc(13px*var(--fs,1));border-top:0}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tbody th{text-align:left;font-weight:600}
tr.tot th,tr.tot td{background:var(--soft);font-weight:700}
td .pv{display:inline-block;min-width:48px}
.bar{display:inline-block;width:56px;height:6px;background:var(--soft);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--P)}
.bar.low i{background:var(--F)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
.chart{display:flex;align-items:stretch;gap:2px;height:170px;padding:0 0 4px}
.chart .col{flex:1 1 0;min-width:3px;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;background:var(--soft)}
.chart .col i{display:block}
.chart .P{background:var(--P)}.chart .R{background:var(--R)}.chart .J{background:var(--J)}.chart .F{background:var(--F)}
.xl{display:flex;gap:2px;font-size:calc(11px*var(--fs,1));color:var(--mut);margin-top:3px}
.xl span{flex:1 1 0;min-width:0;text-align:center;overflow:hidden}
.xl.two{justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(13px*var(--fs,1));color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:26px 16px;text-align:center;color:var(--mut)}
.note{font-size:calc(13px*var(--fs,1));color:var(--mut)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:calc(12.5px*var(--fs,1));font-weight:600}
.chip.P{background:var(--Ps);color:var(--P)}.chip.R{background:var(--Rs);color:var(--R)}.chip.F{background:var(--Fs);color:var(--F)}.chip.J{background:var(--Js);color:var(--J)}.chip.N{background:var(--soft);color:var(--mut)}
.link{background:none;border:0;padding:0;color:var(--focus);cursor:pointer;font-weight:600;text-align:left}
.link:hover{text-decoration:underline}
/* pasar lista */
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:var(--cpy,9px) 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lname{flex:1 1 220px;min-width:0}

/* ===== SICET 4.1 · marca, gráficas y nuevas pantallas ===== */
:root{--sx-main:#0F4D5C;--sx-eraser:#0F4D5C;--sx-cone:#F4D6A0;--gold:#DF9F3E;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--cat-aca:#2a78d6;--cat-per:#eb6834;--cat-soc:#1baf7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sx-main:#E6EBF1;--sx-eraser:#E6EBF1;--sx-cone:#E6EBF1;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--cat-aca:#3987e5;--cat-per:#d95926;--cat-soc:#199e70}}
:root[data-theme="dark"]{--sx-main:#E6EBF1;--sx-eraser:#E6EBF1;--sx-cone:#E6EBF1;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--cat-aca:#3987e5;--cat-per:#d95926;--cat-soc:#199e70}
.sxlogo{display:block;height:auto}
.sxlogo.w{--sx-main:#fff;--sx-eraser:#fff;--sx-cone:#fff}
/* menú lateral */
.appmark{display:block;margin:0 0 6px;padding:2px 4px 12px;border-bottom:1px solid var(--line)}
.appmark .sxlogo{width:150px;max-width:100%}
.appmark small{display:block;color:var(--mut);opacity:1;font-size:calc(10px*var(--fs,1));line-height:1.3;margin-top:4px;letter-spacing:.01em}
html[data-lat=acento] .appmark,html[data-lat=oscuro] .appmark{--sx-main:#fff;--sx-eraser:#fff;--sx-cone:#fff;border-color:rgba(255,255,255,.18)}
html[data-lat=acento] .appmark small,html[data-lat=oscuro] .appmark small{color:rgba(255,255,255,.75)}
.sfv{font-size:calc(11px*var(--fs,1));opacity:.7;margin-top:2px}
@media (max-width:860px){.appmark{display:block;border:0;padding:0 6px 0 2px;margin:0;flex:none}.appmark .sxlogo{width:84px}.appmark small{display:none}}
/* pantalla de carga */
.splash{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.splash .sxlogo{width:min(360px,80vw)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sxspin .8s linear infinite}
@keyframes sxspin{to{transform:rotate(360deg)}}
.sfallback{max-width:420px;opacity:0;animation:sxfade .4s 6s forwards}
@keyframes sxfade{to{opacity:1}}
/* acceso */
#login{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--brand) 14%,var(--bg)),var(--bg))}
.lwrap{margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);width:min(860px,100%);background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(10,30,40,.12)}
.lwrap .lbox{border:0;border-radius:0;width:auto;margin:0;padding:34px 32px}
.lhero{background:#0F4D5C;color:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;overflow:hidden}

.lhero .sxlogo{width:min(320px,100%)}
.ltag{margin:0;font-size:calc(15px*var(--fs,1));line-height:1.5;color:rgba(255,255,255,.88);max-width:34ch}
.lesc{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;font-weight:600;max-width:100%}

/* sub pestañas */
.segtabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--surf)}

/* globo de información */
#vtip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:calc(12.5px*var(--fs,1));line-height:1.4;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* gráficas */
.vz{width:100%;height:auto;display:block;overflow:visible}
.vz-grid{stroke:var(--line);stroke-width:1}

.vzb-b.cat-aca{background:var(--cat-aca)}.vzb-b.cat-per{background:var(--cat-per)}.vzb-b.cat-soc{background:var(--cat-soc)}

.vzc{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.vzc-c{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}

.vzc-c span{font-size:calc(11.5px*var(--fs,1));color:var(--mut);text-align:center;line-height:1.2}
.vzc-c small{font-weight:600;font-size:calc(12px*var(--fs,1))}
.vzs{width:56px;height:30px;vertical-align:middle}
/* mapa de calor */
table.heat{border-collapse:separate;border-spacing:2px}
table.heat th,table.heat td{border:0;padding:6px 8px}
table.heat thead th{vertical-align:bottom;font-size:calc(11.5px*var(--fs,1))}
table.heat thead th span{display:inline-block;max-width:92px;white-space:normal;line-height:1.15;text-align:center}
.hc{text-align:center!important;font-weight:600;font-variant-numeric:tabular-nums;border-radius:6px;cursor:pointer;min-width:52px}
.hc.P{background:var(--Ps);color:var(--P)}.hc.R{background:var(--Rs);color:var(--R)}.hc.F{background:var(--Fs);color:var(--F)}.hc.N{background:transparent;color:var(--mut);cursor:default}

/* captura */
table.calgrid td{padding:4px 6px}

.calin{width:64px;text-align:center;padding:6px 4px;font-variant-numeric:tabular-nums}
.calin.F{border-color:var(--F);color:var(--F);font-weight:600}.calin.R{border-color:var(--R)}
.warnbox.alerta{background:var(--Fs);border-color:var(--F)}
/* alerta temprana */
.semaf{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}

.catrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.catc{border-radius:10px;padding:10px 12px;border:1px solid var(--line);border-left-width:4px}
.catc b{display:block;font-size:calc(24px*var(--fs,1))}.catc span{font-size:calc(12.5px*var(--fs,1));color:var(--mut)}
.catc.cat-aca{border-left-color:var(--cat-aca)}.catc.cat-per{border-left-color:var(--cat-per)}.catc.cat-soc{border-left-color:var(--cat-soc)}
.rsgcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
/* celulares */
.celgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* ====== tableros KPI ====== */
.kpi{--k-bg:transparent;--k-card:var(--surf);--k-ink:var(--ink);--k-mut:var(--mut);--k-line:var(--line);--k1:var(--brand);--k2:var(--s2);--k3:var(--s3);--k4:#eda100;--k5:#e87ba4;color:var(--k-ink);margin:14px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi{--k4:#c98500;--k5:#d55181}}
:root[data-theme="dark"] .kpi{--k4:#c98500;--k5:#d55181}
.kpi.oscuro{--k-bg:#0e1a2b;--k-card:#15233a;--k-ink:#ffffff;--k-mut:#b9c4d4;--k-line:#2a3a55;--k1:#3987e5;--k2:#d95926;--k3:#199e70;--k4:#c98500;--k5:#d55181;--P:#2fbf8f;--R:#e0a12a;--F:#ef6b6b;background:var(--k-bg);border-radius:16px;padding:16px;color-scheme:dark}

.kbars{display:flex;flex-direction:column;gap:8px}.kbar{display:grid;grid-template-columns:minmax(80px,30%) 1fr 58px;gap:10px;align-items:center;font-size:13px}

.kbar b{text-align:right;color:var(--k-ink);font-variant-numeric:tabular-nums}
.kcols{display:flex;align-items:flex-end;gap:6px;min-height:170px;overflow-x:auto;padding-top:6px}
.kcol{flex:1 0 28px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--k-mut)}.kcol i{width:70%;max-width:42px;border-radius:4px 4px 0 0;display:block}
.kcol span{white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}.kcol small{color:var(--k-ink);font-weight:700}

.kline{width:100%;height:auto;max-height:300px}.k-grid{stroke:var(--k-line);stroke-width:1}.k-ax{fill:var(--k-mut);font-size:10px}.k-lab{fill:var(--k-ink);font-size:11px;font-weight:700}
.ktab{width:100%;border-collapse:collapse;font-size:13px;color:var(--k-ink)}.ktab th,.ktab td{padding:6px 4px;border-bottom:1px solid var(--k-line);text-align:center}.ktab .l{text-align:left}.ktab th{color:var(--k-mut);font-weight:700}
.ktablas{margin-top:12px}.ktablas>summary{font-weight:700;padding:8px 0}

async function listar(d){const o=[];for await(const [n,h] of d.entries())if(h.kind==='file')o.push(n);return o}
async function leer(d,n){return new Uint8Array(await(await(await d.getFileHandle(n)).getFile()).arrayBuffer())}
async function escribir(d,n,bytes){const w=await(await d.getFileHandle(n,{create:true})).createWritable();await w.write(bytes);await w.close()}
async function claveSync(pass,saltB64,iter){
  const k=await crypto.subtle.importKey('raw',_te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function gz(u8,comp){
  if(typeof CompressionStream==='undefined'){if(!comp&&window.pako)return window.pako.ungzip(u8);return null}
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(comp?new CompressionStream('gzip'):new DecompressionStream('gzip'))).arrayBuffer());
}
async function cifrar(u8,key){
  key=key||SY.key;const z=await gz(u8,true),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,z||u8)),out=new Uint8Array(17+ct.length);
  out.set(_te.encode(z?'ASXZ1':'ASXP1'));out.set(iv,5);out.set(ct,17);return out;
}
async function descifrar(b,key){
  key=key||SY.key;const h=_td.decode(b.subarray(0,5));if(!/^ASX[ZP]1$/.test(h))throw new Error('Archivo de sincronización no válido.');
  const pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.subarray(5,17)},key,b.subarray(17)));return h[3]==='Z'?await gz(pt,false):pt;
}
function encolarTodo(){

  for(const k in D.cfg)add('c|'+k,{t:'cfg',k,v:D.cfg[k]});
  for(const id in D.users)add('u|'+id,{t:'user',u:D.users[id]});
  for(const id in D.al)add('a|'+id,{t:'al',a:D.al[id]});
  for(const d in D.reg)for(const id in D.reg[d])add('r|'+d+'|'+id,{t:'reg',d,id,v:D.reg[d][id]});
  for(const id in D.bit)for(const e of D.bit[id])add('b|'+id+'|'+e.i,{t:'bitAdd',id,e});
  for(const d in D.ent)for(const id in D.ent[d])add('e|'+d+'|'+id,{t:'ent',d,id,rec:D.ent[d][id]});
  for(const d in D.aul)for(const id in D.aul[d])add('l|'+d+'|'+id,{t:'aul',d,id,rec:D.aul[d][id]});
  for(const d in D.lst)for(const g in D.lst[d])add('x|'+d+'|'+g,{t:'lst',d,g,rec:D.lst[d][g]});
  for(const d in D.inc)for(const id in D.inc[d])add('i|'+d+'|'+id,{t:'inc',d,id,rec:D.inc[d][id]});
  for(const d in D.mod)for(const m in D.mod[d])for(const id in D.mod[d][m])add('m|'+d+'|'+m+'|'+id,{t:'mod',d,m:Number(m),id,rec:D.mod[d][m][id]});
  for(const d in D.lstm)for(const k in D.lstm[d]){const i=k.indexOf('|');add('y|'+d+'|'+k.slice(0,i)+'|'+k.slice(i+1),{t:'lstm',d,m:Number(k.slice(0,i)),g:k.slice(i+1),rec:D.lstm[d][k]})}
  for(const id in D.cond)add('k|'+D.cond[id].d+'|'+id,{t:'cond',d:D.cond[id].d,id,rec:D.cond[id]});
  for(const id in D.bd)add('g|'+D.bd[id].d+'|'+id,{t:'bd',d:D.bd[id].d,id,rec:D.bd[id]});

async function syncEnviar(){
  let n=0;
  while(OUT.length){
    const lote=OUT.slice(0,1500),seq=(SY.seq||0)+1;
    await escribir(SY.sub,'c-'+SY.dev+'-'+String(seq).padStart(8,'0')+'.asx',await cifrar(_te.encode(JSON.stringify({dev:SY.dev,seq,esc:SY.esc,ops:lote}))));
    SY.seq=seq;OUT=OUT.slice(lote.length);n+=lote.length;await syncSave();await IDB.put('kv','out',OUT);
  }
  SY.pend=0;return n;
}
async function syncRecibir(){
  const cur=SY.cursor||{},por=new Map();
  for(const nombre of await listar(SY.sub)){
    const m=nombre.match(/^c-([A-Za-z0-9]+)-(\d{8})\.asx$/);if(!m||m[1]===SY.dev||+m[2]<=(cur[m[1]]||0))continue;
    if(!por.has(m[1]))por.set(m[1],new Set());por.get(m[1]).add(+m[2]);
  }
  let aplicados=0;
  for(const [dev,seqs] of por){
    for(let s=(cur[dev]||0)+1;seqs.has(s);s++){
      let d;try{d=JSON.parse(_td.decode(await descifrar(await leer(SY.sub,'c-'+dev+'-'+String(s).padStart(8,'0')+'.asx'))))}catch(e){break}
      if(d.esc===SY.esc)for(const o of d.ops||[])if(aplicarRemoto(o,dev))aplicados++;
      cur[dev]=s;
    }
  }
  SY.cursor=cur;if(aplicados){save()}await syncSave();return {aplicados};
}
let syncTimer=null,syncCola=null;
function syncSoon(){if(!SY.activo)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncAhora(),3000)}
function syncAhora(manual){
  if(!SY.activo||!SY.key)return Promise.resolve();
  if(SY.ocupado){if(!syncCola)syncCola=SY.promesa.then(()=>{syncCola=null;return syncAhora(manual)});return syncCola}
  SY.ocupado=true;footNote();
  SY.promesa=(async()=>{
    try{
      if(!await permisoOk(!!manual)){SY.err='permiso';if(manual)toast('Da permiso a la carpeta de sincronización en Ajustes.','err');return}
      const r=await syncRecibir(),n=await syncEnviar();SY.err='';SY.ult=Date.now();
      if(r.aplicados){sesionRefrescar();uiTouched(true)}
      if(manual)toast('Sincronizado: '+r.aplicados+' cambio'+(r.aplicados===1?'':'s')+' recibido'+(r.aplicados===1?'':'s')+' y '+n+' enviado'+(n===1?'':'s')+'.');
    }catch(e){SY.err=e.message||String(e);if(manual)toast('No se pudo sincronizar: '+SY.err,'err')}
    finally{SY.ocupado=false;footNote()}
  })();
  return SY.promesa;
}

async function syncConfigurar(dir,clave,o){
  o=o||{};const modo0=o.modo||'subir';let modo=modo0;
  const sub=await syfDir(dir,!o.soloExistente);
  let info=await infoCarpeta(dir),key;
  if(info){
    key=await claveSync(clave,info.salt,info.iter);
    try{if(_td.decode(await descifrar(unb64(info.prueba),key))!=='AsisteMX')throw new Error()}catch(e){throw new Error('La clave de sincronización no es correcta para esta carpeta.')}
  }else{

    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));key=await claveSync(clave,salt,210000);
    info={app:'AsisteMX',formato:1,esc:'E'+hexR(6),nombre:D.cfg.escuela||'',salt,iter:210000,prueba:b64(await cifrar(_te.encode('AsisteMX'),key)),creado:new Date().toISOString()};
    await escribir(sub,'escuela.json',_te.encode(JSON.stringify(info,null,1)));modo='subir';
  }

  await syncSave();await IDB.put('kv','out',OUT);bitacora(modo==='reemplazar'?'Computadora conectada a la escuela':'Sincronización activada');
  save();await syncAhora(true);
}

function range(tipo,ref,cu){

function compute(from,to,pred){
  const S={},Tt={};
  const dates=Object.keys(D.reg).filter(x=>x>=from&&x<=to).sort();
  for(const date of dates){
    const day=D.reg[date];
    for(const id in day){
      const a=D.al[id];if(!a||!pred(a))continue;
      const v0=day[id],s=(v0[0]==='P'&&v0.slice(1,10)==='|Retardo ')?'R':v0[0];
      const o=S[id]||(S[id]={P:0,R:0,F:0,J:0,run:0,max:0});
      o[s]++;

      const t=Tt[date]||(Tt[date]={P:0,R:0,F:0,J:0});t[s]++;

  }
  return {S,T:Tt};
}

function qrMatrix(text){if(!window.qrcode)throw new Error('sin generador QR');const q=qrcode(0,'M');q.addData(text);q.make();return {n:q.getModuleCount(),dark:(r,c)=>q.isDark(r,c)}}
function qrSVG(text){
  if(!window.qrcode)return '<div class="empty">No se pudo cargar el generador de QR. Revisa la conexión a internet del servidor.</div>';
  const m=qrMatrix(text);let d='';
  for(let r=0;r<m.n;r++)for(let c=0;c<m.n;c++)if(m.dark(r,c))d+='M'+(c+4)+' '+(r+4)+'h1v1h-1z';
  const s=m.n+8;
  return '<svg viewBox="0 0 '+s+' '+s+'" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function qrPNG(a){
  const m=qrMatrix(code(a)),W=560,H=740,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const cell=Math.floor(460/(m.n+8)),size=cell*(m.n+8),ox=Math.round((W-size)/2),oy=60;
  x.fillStyle='#000';
  for(let r=0;r<m.n;r++)for(let q=0;q<m.n;q++)if(m.dark(r,q))x.fillRect(ox+(q+4)*cell,oy+(r+4)*cell,cell,cell);
  x.textAlign='center';x.fillStyle='#222';
  x.font='600 22px sans-serif';x.fillText(D.cfg.escuela||'Escuela secundaria',W/2,40);
  x.font='700 30px sans-serif';
  const nm=fullName(a);x.fillText(nm.length>30?nm.slice(0,29)+'…':nm,W/2,oy+size+50);
  x.font='500 24px sans-serif';x.fillText(grp(a)+'  ·  Matrícula '+a.mat,W/2,oy+size+90);
  return new Promise(res=>c.toBlob(res,'image/png'));
}

async function saveFile(name,data){

const csvCell=v=>{v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCSV(txt){
  txt=txt.replace(/^\ufeff/,'');
  const first=txt.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}

function afterScan(){
  const m=$('#manual');
  if(m)m.addEventListener('keydown',e=>{if(e.key==='Enter'&&m.value.trim()){handleScan(m.value,true);m.value=''}});
  const g=$('#scgr'),p=$('#scgp');if(g)g.onchange=()=>U.sc.gr=g.value;if(p)p.onchange=()=>U.sc.gp=p.value;
  updateScanLog();
}
function updateScanLog(){
  const t=todayISO(),day=D.reg[t]||{},act=activos();
  const c={P:0,R:0,N:0};act.forEach(a=>{const v=day[a.id];if(!v)c.N++;else if(v[0]==='P')c.P++;else if(v[0]==='R')c.R++});
  const cn=$('#scancounts');if(cn)cn.innerHTML='<span class="cP">Presentes '+c.P+'</span><span class="cR">Retardos '+c.R+'</span><span>Sin registro '+c.N+'</span>';
  const items=[];for(const id in day){const v=day[id],a=D.al[id];if(!a)continue;const i=v.indexOf('|');if(i>0&&(v[0]==='P'||v[0]==='R'))items.push({a,s:v[0],h:v.slice(i+1)})}
  items.sort((x,y)=>y.h.localeCompare(x.h));
  const l=$('#scanlog');if(l)l.innerHTML=items.slice(0,25).map(i=>'<li><time>'+esc(i.h)+'</time><span style="flex:1">'+esc(fullName(i.a))+' <span class="note">'+grp(i.a)+'</span></span><span class="chip '+i.s+'">'+ST[i.s]+'</span></li>').join('')||'<li class="note">Todavía no hay entradas escaneadas hoy.</li>';
}
function beep(ok){if(!PREF.sonido)return;try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();c.close()},ok?110:280)}catch(e){}}
function handleScan(raw,force){
  const now=Date.now();raw=String(raw).trim();activity();
  if(!force&&raw===lastCode&&now-lastAt<2500)return;
  lastCode=raw;lastAt=now;
  const mat=raw.startsWith('ASIST|')?raw.slice(6):raw,a=findMat(mat),box=$('#scanres');
  if(!a||a.baja){beep(false);if(box){box.className='scanres err';box.innerHTML='<b>Código no reconocido</b>Puede ser de otro grupo o no estar registrado. Deja pasar al alumno y avisa en control escolar.'}return}
  const t=todayISO(),cur=getReg(t,a.id),hm=nowHM();
  if(cur&&(cur.s==='P'||cur.s==='R')){beep(false);if(box){box.className='scanres dup';box.innerHTML='<b>'+esc(fullName(a))+'</b>'+grp(a)+' · ya registrado hoy'+(cur.x?' a las '+esc(cur.x):'')}return}
  const s=hm<=addMin(D.cfg.horaEntrada,D.cfg.tolerancia)?'P':'R';
  setReg(t,a.id,s,hm);beep(true);
  if(box){box.className='scanres '+s;box.innerHTML='<b>'+esc(fullName(a))+'</b>'+grp(a)+' · '+(s==='P'?'Presente · pasa a su salón':'Retardo · se incorpora a su siguiente sesión')+' ('+hm+')'}
  updateScanLog();footNote();
}
let bd=null;
async function startCam(){
  const msg=$('#camMsg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Este navegador solo permite la cámara en https o en localhost. Usa un lector USB, la captura manual o abre la página desde el equipo servidor.';return}
  bd=null;
  if('BarcodeDetector' in window){try{bd=new BarcodeDetector({formats:['qr_code']})}catch(e){bd=null}}
  if(!bd&&!window.jsQR){msg.textContent='Preparando el lector…';await loadJsQR()}
  if(!bd&&!window.jsQR){msg.textContent='Este navegador no lee QR con la cámara sin internet. Usa Chrome o Edge actualizado, un lector USB o escribe la matrícula.';return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('#cam');v.srcObject=stream;await v.play();$('#camwrap').hidden=false;$('#camBtn').textContent='Detener cámara';msg.textContent='Apunta el código QR del alumno a la cámara.';scanLoop();
  }catch(e){stream=null;msg.textContent='No se pudo abrir la cámara ('+(e&&e.name||'error')+'). Revisa el permiso del navegador o usa un lector USB.'}
}
function stopCam(){
  clearTimeout(camT);camT=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const w=$('#camwrap');if(w)w.hidden=true;const b=$('#camBtn');if(b)b.textContent='Activar cámara';
}
async function scanLoop(){
  const v=$('#cam');if(!stream||!v)return;
  try{
    if(v.readyState>=2&&v.videoWidth){
      if(bd){const res=await bd.detect(v);if(res&&res[0]&&res[0].rawValue)handleScan(res[0].rawValue)}
      else if(window.jsQR){
        const c=$('#cv'),k=Math.min(1,640/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
        const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);
        const img=x.getImageData(0,0,c.width,c.height),r=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
        if(r&&r.data)handleScan(r.data);
      }
    }
  }catch(e){}
  if(stream)camT=setTimeout(scanLoop,130);
}

async function inflateRaw(data){

function unzipIndex(buf){

    files[dec.decode(u8.subarray(p+46,p+46+nl))]={method,csize,lho};p+=46+nl+el+cl;
  }

    const f=files[name];if(!f)return null;
    const nl=dv.getUint16(f.lho+26,true),el=dv.getUint16(f.lho+28,true),st=f.lho+30+nl+el,data=u8.subarray(st,st+f.csize);

}

function sheetRows(doc,ss){

    const arr=[];

      const ref=c.getAttribute('r')||'',t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
      if(t==='s'&&v)val=ss[Number(v.textContent)]||'';

      arr[ref?colIdx(ref):arr.length]=val;
    }

}

  const rd=unzipIndex(buf),dec=new TextDecoder(),get=async n=>{const d=await rd(n);return d?dec.decode(d):null},dom=x=>new DOMParser().parseFromString(x,'application/xml');
  const wb=await get('xl/workbook.xml');if(!wb)throw new Error('El archivo no parece un libro de Excel (.xlsx).');

}
async function readUpload(file){
  const buf=await file.arrayBuffer(),nm=(file.name||'').toLowerCase(),h=new Uint8Array(buf,0,Math.min(4,buf.byteLength));
  if(h[0]===0x50&&h[1]===0x4b)return readXLSX(buf);

const WORDG={primero:1,segundo:2,tercero:3};
function sheetGroup(name){
  const t=String(name).trim(),m=t.match(/^(\d{1,2})\s*[°º.\-_ ]*\s*([A-Za-z][A-Za-z0-9]{0,2})$/);
  if(m)return {gr:Number(m[1]),gp:m[2].toUpperCase()};
  const w=t.toLowerCase().match(/^(primero|segundo|tercero)\s*[°º.\-_ ]*\s*([a-z][a-z0-9]{0,2})$/);
  return w?{gr:WORDG[w[1]],gp:w[2].toUpperCase()}:null;
}
function sexOf(v){
  v=String(v||'').trim().toLowerCase();if(!v)return '';
  if(/^(h|hombre|masculino|masc|var[oó]n|ni[nñ]o)$/.test(v))return 'H';
  if(/^(m|f|mujer|femenino|fem|ni[nñ]a)$/.test(v))return 'M';
  return null;
}
function dateOf(v){
  v=String(v||'').trim();if(!v)return '';
  if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=y>30?1900:2000;const d=+m[1],mo=+m[2];if(mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

const IGN_SILENT=new Set(['revision','revisionnosecarga','estado','observaciones','no','num','numero','n','consecutivo']);
const SHEET_SKIP=/^(instrucciones|leeme|lista|listas|catalogo|catalogos|ayuda|ejemplo|ejemplos|resumen)$/i;
const PARTIC=new Set(['de','del','la','las','los','el','y','e','van','von','da','di','do','dos']);
function tcase(s){

  return s.toLowerCase().replace(/(^|[\s\-'’.])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).split(' ').map((w,i)=>i>0&&PARTIC.has(w.toLowerCase())?w.toLowerCase():w).join(' ');

  if(n.length>=4&&cand.length===1)return {v:cand[0],fix:'Tecnología «'+raw+'» → «'+cand[0]+'»'};

function telOf(t){

  if(!byGroup)return {plain:true,title:'Plantilla',lines:[],sheets:[inst,{name:'Alumnos',title:'Alumnos',freeze:1,dv:dvSex,cols:TPL_HEAD.map(head),rows:[],foots:[]}]};

function buildMsg(a,o,label){
  return (D.cfg.plantilla||TPL).replace(/\{tutor\}/g,a.tut||'tutor').replace(/\{alumno\}/g,fullName(a)).replace(/\{grupo\}/g,grp(a)).replace(/\{faltas\}/g,o.F).replace(/\{periodo\}/g,label).replace(/\{escuela\}/g,D.cfg.escuela||'la escuela');

function avisosList(o){
  o=o||U.av;const [from,to]=rng(o),pred=filt(o),{S}=compute(from,to,pred),out=[];
  for(const a of activos().filter(pred)){
    const s=S[a.id];if(!s)continue;const why=[],pc=pctO(s);
    if(s.F>=D.cfg.umbralFaltas)why.push(s.F+' faltas sin justificar');
    if(D.cfg.umbralRetardos&&s.R>=D.cfg.umbralRetardos)why.push(s.R+' retardos');
    if(s.max>=3)why.push(s.max+' faltas seguidas');
    if(pc!=null&&tot(s)>=3&&pc<D.cfg.umbralPct)why.push('Asistencia '+pc.toFixed(0)+'%');
    if(why.length)out.push({a,s,why});
  }
  return out.sort((x,y)=>y.s.F-x.s.F);
}

const PAPER={carta:{n:'Carta (21.6 × 27.9 cm)',w:612,h:792,x:1,i:'8.5in',j:'11in'},oficio:{n:'Oficio (21.6 × 33 cm)',w:612,h:936,x:14,i:'8.5in',j:'13in'},legal:{n:'Legal (21.6 × 35.6 cm)',w:612,h:1008,x:5,i:'8.5in',j:'14in'},a4:{n:'A4 (21 × 29.7 cm)',w:595.28,h:841.89,x:9,i:'210mm',j:'297mm'}};
const REPS=[
  {id:'resumen',n:'Resumen de asistencia',d:'Por grado, por grupo, por sexo y por grado y sexo.',per:true},
  {id:'matriz',n:'Registro de asistencia por grupo',d:'Cuadrícula de alumnos por día, una hoja por grupo. Elige semana, quincena, mes o un rango de hasta 31 días.',per:true},
  {id:'alumnos',n:'Asistencia por alumno',d:'Presentes, retardos, faltas y porcentaje de cada alumno.',per:true},
  {id:'diario',n:'Asistencia por día',d:'Totales de cada día con lista tomada.',per:true},
  {id:'seguimiento',n:'Alumnos en seguimiento',d:'Alumnos que cumplen los criterios de acompañamiento del periodo.',per:true},
  {id:'lista',n:'Lista de alumnos por grupo',d:'Relación de alumnas y alumnos, una hoja por grupo.',per:false}
];
const C=(h,w,a,t)=>({h,w,a:a||'l',t:t||'s'});
const STC={P:'•',R:'R',F:'F',J:'J'};
const sxL=s=>s==='H'?'Hombres':s==='M'?'Mujeres':'Todos';
function rcolors(){const t=D.cfg.tema||{},ok=h=>/^#[0-9a-f]{6}$/i.test(h||'');return {brand:ok(t.brand)?t.brand:'#0F4D5C',P:ok(t.P)?t.P:'#12806A',R:ok(t.R)?t.R:'#B87400',F:ok(t.F)?t.F:'#BF3535',J:ok(t.J)?t.J:'#4F63B5'}}
function hdrLines(o,def){const L=[];if(def.per)L.push('Periodo: '+plabel(o));const f=['Grado: '+(o.gr?o.gr+'°':'Todos'),'Grupo: '+(o.gp||'Todos')];if(o.tec)f.push('Tecnología: '+o.tec);if(def.id!=='lista')f.push('Sexo: '+sxL(o.sx));L.push(f.join('  ·  '));return L}
const groupsOf=studs=>{const m=new Map();studs.forEach(s=>{const k=s.gr+'|'+s.gp;if(!m.has(k))m.set(k,[]);m.get(k).push(s)});return [...m.values()]};

function buildReport(o){
  const def=REPS.find(r=>r.id===o.id)||REPS[0],pred=filt(o);
  const mk=extra=>Object.assign({id:def.id,title:def.n,lines:hdrLines(o,def),sheets:[]},extra);
  const [a,b]=def.per?rng(o):[todayISO(),todayISO()];
  switch(def.id){
    case 'resumen':{
      const {S}=compute(a,b,pred),studs=activos().filter(pred).sort(cmpA);
      if(!studs.length)return {error:'No hay alumnos con estos filtros.'};
      const cols=first=>[C(first,2.6),C('Alumnos',1,'r','n'),C('Asistencia',1.2,'r','p'),C('Presentes',1,'r','n'),C('Retardos',1,'r','n'),C('Faltas',1,'r','n'),C('Justif.',1,'r','n'),C('Faltas H',1,'r','n'),C('Faltas M',1,'r','n')];
      const row=r=>[r.l,r.n,pctO(r),r.P,r.R,r.F+r.J,r.J,r.FH,r.FM];
      const sh=(name,first,rows)=>{const t={l:'Total',n:0,P:0,R:0,F:0,J:0,FH:0,FM:0};rows.forEach(r=>{for(const k of ['n','P','R','F','J','FH','FM'])t[k]+=r[k]});return {name,title:name,cols:cols(first),rows:rows.map(row),foots:rows.length>1?[row(t)]:[]}};
      return mk({sheets:[sh('Por grado','Grado',aggBy(S,studs,x=>x.gr,x=>x.gr+'°')),sh('Por grupo','Grupo',aggBy(S,studs,x=>x.gr+'-'+x.gp,x=>grp(x))),sh('Por sexo','Sexo',aggBy(S,studs,x=>x.sx,x=>x.sx==='H'?'Hombres':'Mujeres')),sh('Grado y sexo','Grado y sexo',aggBy(S,studs,x=>x.gr+'-'+x.sx,x=>x.gr+'° '+(x.sx==='H'?'Hombres':'Mujeres')))].concat(studs.some(x=>x.tec)?[sh('Por tecnología','Tecnología',aggBy(S,studs,x=>x.tec||'~',x=>x.tec||'Sin tecnología'))]:[])});
    }
    case 'matriz':{
      const days=schoolDays(a,b);
      if(days.length>31)return {error:'Elige una semana, quincena, mes o un rango de hasta 31 días hábiles para este reporte.'};
      if(!days.length)return {error:'El periodo no tiene días hábiles.'};
      const {S}=compute(a,b,pred),studs=activos().filter(pred).sort(cmpA);
      if(!studs.length)return {error:'No hay alumnos con estos filtros.'};
      const sheets=groupsOf(studs).map(g=>{
        const cols=[C('No.',.55,'c','n'),C('Alumno',3.6,'l'),...days.map(d=>C(DIAS[pd(d).getDay()].charAt(0).toUpperCase()+'\n'+pd(d).getDate(),.5,'c','st')),C('P',.55,'c','n'),C('R',.55,'c','n'),C('F',.55,'c','n'),C('J',.55,'c','n'),C('%',.9,'c','p')];
        const rows=g.map((s,i)=>{const o2=S[s.id]||{P:0,R:0,F:0,J:0};return [i+1,fullName(s),...days.map(d=>{const r=getReg(d,s.id);return r?r.s:''}),o2.P,o2.R,o2.F,o2.J,pctO(o2)]});
        const att=['','Asistentes (presentes + retardos)',...days.map(d=>g.reduce((n,s)=>{const r=getReg(d,s.id);return n+(r&&(r.s==='P'||r.s==='R')?1:0)},0)),'','','','',''];
        const aus=['','Faltas (con justificadas)',...days.map(d=>g.reduce((n,s)=>{const r=getReg(d,s.id);return n+(r&&(r.s==='F'||r.s==='J')?1:0)},0)),'','','','',''];
        return {name:grp(g[0]),title:'Grupo '+grp(g[0])+' · '+g.length+' alumnos',cols,rows,foots:[att,aus]};
      });
      return mk({sheets,legend:'• Presente   R Retardo   F Falta   J Justificada'});
    }
    case 'alumnos':{
      const {S}=compute(a,b,pred),studs=activos().filter(pred).sort(cmpA);
      if(!studs.length)return {error:'No hay alumnos con estos filtros.'};
      const t={P:0,R:0,F:0,J:0};
      const rows=studs.map((x,i)=>{const s=S[x.id]||{P:0,R:0,F:0,J:0};for(const k in t)t[k]+=s[k];return [i+1,x.mat,fullName(x),grp(x),x.sx,s.P,s.R,s.F+s.J,s.J,pctO(s)]});
      return mk({sheets:[{name:'Por alumno',title:'Por alumno',cols:[C('No.',.5,'c','n'),C('Matrícula',1.2),C('Alumno',3.6),C('Grupo',.8,'c'),C('Sexo',.6,'c'),C('Presentes',1,'c','n'),C('Retardos',1,'c','n'),C('Faltas',.9,'c','n'),C('Justif.',.9,'c','n'),C('Asistencia',1.1,'c','p')],rows,foots:[['','','Total','','',t.P,t.R,t.F+t.J,t.J,pctO(t)]]}]});
    }
    case 'diario':{
      const {T}=compute(a,b,pred),dates=Object.keys(T).sort();
      if(!dates.length)return {error:'No hay listas registradas en este periodo.'};
      const t={P:0,R:0,F:0,J:0};
      const rows=dates.map(d=>{const s=T[d];for(const k in t)t[k]+=s[k];return [fdc(d),s.P,s.R,s.F+s.J,s.J,pctO(s)]});
      return mk({sheets:[{name:'Por día',title:'Por día',cols:[C('Fecha',2),C('Presentes',1,'c','n'),C('Retardos',1,'c','n'),C('Faltas',1,'c','n'),C('Justif.',1,'c','n'),C('Asistencia',1.2,'c','p')],rows,foots:[['Total',t.P,t.R,t.F+t.J,t.J,pctO(t)]]}]});
    }
    case 'seguimiento':{
      const list=avisosList(o);
      if(!list.length)return {error:'Ningún alumno cumple los criterios de seguimiento en este periodo.'};
      const cc=can('contacto');
      const cols=[C('Alumno',3),C('Grupo',.8,'c'),C('Faltas',.8,'c','n'),C('Justif.',.8,'c','n'),C('Seguidas',.9,'c','n'),C('Retardos',.9,'c','n'),C('Asistencia',1,'c','p'),C('Motivo',2.6),...(cc?[C('Tutor',2),C('Teléfono',1.3)]:[])];
      const rows=list.map(({a:x,s,why})=>[fullName(x),grp(x),s.F+s.J,s.J,s.max||0,s.R,pctO(s),why.join('; '),...(cc?[x.tut||'',x.tel||'']:[])]);
      return mk({sheets:[{name:'Seguimiento',title:'Seguimiento',cols,rows,foots:[]}]});
    }
    case 'lista':{
      const studs=activos().filter(pred).sort(cmpA);
      if(!studs.length)return {error:'No hay alumnos con estos filtros.'};
      const cc=can('contacto');
      const sheets=groupsOf(studs).map(g=>({name:grp(g[0]),title:'Grupo '+grp(g[0])+' · '+g.length+' alumnos',cols:[C('No.',.5,'c','n'),C('Matrícula',1.2),C('Alumno',3.6),C('Sexo',.6,'c'),...(cc?[C('Tutor',2.2),C('Teléfono',1.3)]:[]),C('Observaciones',2.4)],rows:g.map((s,i)=>[i+1,s.mat,fullName(s),s.sx,...(cc?[s.tut||'',s.tel||'']:[]),'']),foots:[]}));
      return mk({sheets});
    }
  }
  return {error:'Reporte desconocido.'};
}
function buildAlumnoReport(a,o){
  const [f,t]=rng(o),{S}=compute(f,t,x=>x.id===a.id),s=S[a.id]||{P:0,R:0,F:0,J:0,max:0};
  const days=Object.keys(D.reg).filter(d=>d>=f&&d<=t&&D.reg[d][a.id]).sort();
  return {id:'alumno',title:'Reporte de asistencia del alumno',lines:['Alumno: '+fullName(a)+'  ·  Matrícula '+a.mat+'  ·  Grupo '+grp(a),'Periodo: '+plabel(o)],sheets:[
    {name:'Resumen',title:'Resumen',cols:[C('Concepto',2),C('Valor',2,'r')],rows:[['Presentes',s.P],['Retardos',s.R],['Faltas (con justificadas)',s.F+s.J],['De ellas, justificadas',s.J],['Máximo de faltas seguidas',s.max||0],['Asistencia',(pctO(s)==null?'—':pctO(s).toFixed(1)+'%')]],foots:[]},
    {name:'Detalle',title:'Detalle por día',cols:[C('Fecha',1.6),C('Estado',1.4),C('Detalle',3.4)],rows:days.map(d=>{const r=getReg(d,a.id);return [fdc(d)+' '+pd(d).getFullYear(),ST[r.s],r.x||'']}),foots:[]}]};
}

/* --- geometría de página --- */
function pageOpts(rep){
  const P=PAPER[PREF.papel]||PAPER.carta;let land=PREF.orient==='h';
  if(PREF.orient==='auto'||!PREF.orient)land=Math.max(0,...rep.sheets.map(s=>s.cols.length))>=9;
  return {P,land,w:land?P.h:P.w,h:land?P.w:P.h};
}
function fontPt(sh){let f=PREF.tam==='peq'?7.5:9;const n=sh.cols.length;if(n>16)f=Math.min(f,7);if(n>24)f=Math.min(f,6.3);return f}

/* --- HTML (vista previa e impresión) --- */
const firmasDe=rep=>rep.firmas&&rep.firmas.length?rep.firmas:(PREF.firmas?[['Elaboró',ME.nombre],['Vo. Bo. Dirección',D.cfg.resp||'Director(a)']]:null);
function rptHTML(rep){
  const c=rcolors(),hon=onColor(c.brand);
  const al=col=>col.a==='r'?'right':col.a==='c'?'center':'left';
  const cellHTML=(col,v,foot)=>{
    if(col.t==='st'&&!foot){if(!v)return '<td></td>';return '<td style="text-align:center;font-weight:700;background:'+lighten(c[v],0.82)+';color:'+c[v]+'">'+STC[v]+'</td>'}
    let s;if(col.t==='p')s=v==null||v===''?'—':v.toFixed(1)+'%';else s=v==null?'':String(v);
    return '<td style="text-align:'+(foot&&col.t==='st'?'center':al(col))+(foot?';font-weight:700;background:#e6edf4':'')+'">'+esc(s).replace(/\n/g,'<br>')+'</td>';
  };
  const FIR=firmasDe(rep),firm=FIR?'<div class="rpt-firmas">'+FIR.map(f=>'<div><i></i>'+esc(f[0])+(f[1]?'<br><small>'+esc(f[1])+'</small>':'')+'</div>').join('')+'</div>':'';
  return rep.sheets.map(sh=>{
    const sum=sh.cols.reduce((s,k)=>s+k.w,0),fs=fontPt(sh);
    return '<section class="rpt-sheet"><div class="rpt-hd">'+(D.cfg.logo?'<img src="'+D.cfg.logo+'" alt="">':'')+'<div><div class="rpt-es">'+esc(D.cfg.escuela||'Escuela secundaria')+'</div><div class="rpt-sub">'+esc([D.cfg.cct?'CCT '+D.cfg.cct:'',D.cfg.ciclo?'Ciclo '+D.cfg.ciclo:''].filter(Boolean).join(' · '))+'</div></div></div>'+
    '<div class="rpt-ti">'+esc(rep.title)+'</div><div class="rpt-ln">'+rep.lines.map(esc).join('<br>')+'</div>'+(rep.sheets.length>1?'<div class="rpt-st">'+esc(sh.title)+'</div>':'')+
    '<table class="rpt-t" style="font-size:'+fs+'pt"><colgroup>'+sh.cols.map(k=>'<col style="width:'+(k.w/sum*100).toFixed(2)+'%">').join('')+'</colgroup><thead><tr>'+sh.cols.map(k=>'<th style="text-align:'+(k.a==='l'?'left':'center')+';background:'+c.brand+';color:'+hon+'">'+esc(k.h).replace(/\n/g,'<br>')+'</th>').join('')+'</tr></thead><tbody>'+
    sh.rows.map((r,i)=>'<tr'+(i%2?' class="z"':'')+'>'+r.map((v,j)=>cellHTML(sh.cols[j],v)).join('')+'</tr>').join('')+(sh.rows.length?'':'<tr><td colspan="'+sh.cols.length+'" style="text-align:center">Sin datos</td></tr>')+'</tbody>'+
    (sh.foots&&sh.foots.length?'<tfoot>'+sh.foots.map(r=>'<tr>'+r.map((v,j)=>cellHTML(sh.cols[j],v,true)).join('')+'</tr>').join('')+'</tfoot>':'')+'</table>'+(rep.legend?'<div class="rpt-pie">'+esc(rep.legend)+'</div>':'')+firm+
    '<div class="rpt-pie">'+SXLOGO('sx-icon')+'SICET · Emitido por '+esc(ME.nombre)+' · '+esc(new Date().toLocaleString('es-MX'))+'</div></section>';

  if(i.amb==='tec')return !!a.tec&&(i.tecs||[]).includes(a.tec)&&(!(i.grados||[]).length||i.grados.includes(a.gr));

}

const cohorteTxt=i=>(i.amb==='tec'?'Tecnología '+(i.tecs||[]).join(', ')+((i.grados||[]).length?' ('+i.grados.map(g=>g+'°').join(', ')+')':''):i.amb==='plantel'?'Todo el plantel':'Grupos '+(i.grupos||[]).map(g=>g.replace(/^(\d+)/,'$1°')).join(', '));

function modsTxt(a){

const MOT_RET=['Transporte o tráfico','Clima','Problema familiar','Cita o atención médica','Se quedó dormido(a)','Otro motivo'];
const MOT_SUP=['Docente ausente','Docente con permiso económico','Docente en comisión o capacitación','Otro motivo'];
const ENT_N={P:'Puntual',T:'Tolerancia',R:'Retardo',J:'Entrada justificada'};
function limites(){const a=D.cfg.horaEntrada||'07:20';return [a,addMin(a,Number(D.cfg.tolerancia)||0)]}
function claseEnt(hm,a,d){
  const [l1,l2]=limites();let k=hm<=l1?'P':hm<=l2?'T':'R',j='',o='';
  if(k==='R'&&a){
    const inc=incFor(a,d||todayISO());
    if(inc&&(inc.mod===99||(inc.mod>1&&modOf(inc.mod)&&hm<=addMin(modOf(inc.mod).i,Number(D.cfg.tolerancia)||0)))){j=inc.id;o='Justificada: '+inc.motivo+(inc.mod===99?'':' · inician en el '+modLabel(inc.mod))}
  }
  return {k,j,o};
}
const kindOf=e=>e.j?'J':e.k;
const entCls=k=>k==='P'?'P':k==='T'?'R':k==='J'?'J':'F';
function entBadge(e){
  if(!e)return '<span class="chip N">Sin entrada</span>';
  const k=kindOf(e);
  return '<span class="chip '+entCls(k)+'">'+esc(e.h)+' · '+ENT_N[k]+'</span>'+(k==='R'?(e.o?' <span class="note">'+esc(e.o)+'</span>':' <span class="chip F">falta observación</span>'):(e.j&&e.o?' <span class="note">'+esc(e.o)+'</span>':''));
}
const entTxt=e=>'Entrada '+e.h+(e.k==='T'?' (tolerancia)':'')+(e.j?' · '+(e.o||'justificada'):e.k==='R'?' · '+(e.o||'sin observación'):'');
const LR=(late,x)=>late?(D.cfg.retardoModo==='estado'?{s:'R',x}:{s:'P',x:'Retardo · '+x}):{s:'P',x};
function derivedReg(d,id){
  const a0=D.al[id],e=(D.ent[d]||{})[id],au=(D.aul[d]||{})[id],cur=getReg(d,id),inc=a0?incFor(a0,d):null,late=!!(e&&e.k==='R'&&!e.j);
  if(inc&&inc.mod===99){if(au&&au.s==='P')return LR(late,e?entTxt(e):'En aula, sin registro de entrada');if(e)return LR(late,entTxt(e));return {s:'J',x:'Permiso de grupo: '+inc.motivo}}
  if(D.cfg.confirmaAula===false){if(!e)return null;return LR(late,entTxt(e))}
  if(inc&&inc.mod>1&&inc.mod<99&&!au)return null;
  if(!au)return null;
  if(au.s==='P')return LR(late,e?entTxt(e):'En aula, sin registro de entrada');
  if(cur&&cur.s==='J'&&!String(cur.x).startsWith('Permiso de grupo: '))return {s:'J',x:cur.x};
  return {s:'F',x:e?'Entró a las '+e.h+' y no está en el aula':'Sin entrada ni presencia en el aula'};
}
function rederive(d,id){
  const r=derivedReg(d,id);if(!r)return;const cur=getReg(d,id);
  if(cur&&cur.s==='J'&&r.s!=='J'&&!String(cur.x).startsWith('Permiso de grupo: '))return;
  const v=mkV(r.s,r.x);if(D.reg[d]&&D.reg[d][id]===v)return;
  commit({t:'reg',d,id,v},{sys:true});
}

const buildReportBase=buildReport;
buildReport=function(o){
  if(!['entradas','listas','permisos'].includes(o.id))return buildReportBase(o);
  const def=REPS.find(r=>r.id===o.id),[a,b]=rng(o),pred=filt(o),mk=sh=>({id:def.id,title:def.n,lines:hdrLines(o,def),sheets:sh});
  if(o.id==='entradas'){
    const rows=[],res={};
    Object.keys(D.ent).filter(d=>d>=a&&d<=b).sort().forEach(d=>{
      Object.entries(D.ent[d]).filter(([id])=>D.al[id]&&verAl(D.al[id])&&pred(D.al[id])).sort((x,y)=>x[1].h.localeCompare(y[1].h)).forEach(([id,e])=>{
        const s=D.al[id],g=grp(s),k=kindOf(e),r=res[g]||(res[g]={P:0,T:0,R:0,J:0,S:0});r[k]++;if(k==='R'&&!e.o)r.S++;
        rows.push([fdc(d),e.h,fullName(s),g+(s.tec?' · '+s.tec:''),ENT_N[k],k==='R'?(e.o||'SIN OBSERVACIÓN'):(e.j?(e.o||'Justificada'):'—'),e.n||'']);
      });
    });
    if(!rows.length)return {error:'No hay entradas registradas en este periodo.'};
    const t={P:0,T:0,R:0,J:0,S:0},rr=Object.keys(res).sort().map(g=>{const r=res[g];for(const k in t)t[k]+=r[k];return [g,r.P,r.T,r.R,r.J,r.S]});
    return mk([{name:'Detalle',title:'Detalle de entradas',cols:[C('Fecha',1.3),C('Hora',.7,'c'),C('Alumno',3.2),C('Grupo',1.4,'c'),C('Tipo',1.4,'c'),C('Observación',3.2),C('Registró',1.5)],rows,foots:[]},
               {name:'Resumen por grupo',title:'Resumen por grupo',cols:[C('Grupo',1.5),C('Puntuales',1,'c','n'),C('Tolerancia',1,'c','n'),C('Retardos',1,'c','n'),C('Justificadas',1,'c','n'),C('Retardos sin observación',1.6,'c','n')],rows:rr,foots:[['Total',t.P,t.T,t.R,t.J,t.S]]}]);
  }
  if(o.id==='permisos'){
    const rows=[];
    const ds=new Set(Object.keys(D.inc).filter(d=>d>=a&&d<=b));for(let d=a;d<=b&&d<=addDays(todayISO(),60);d=addDays(d,1))if(homVirtuales(d).length)ds.add(d);
    [...ds].sort().forEach(d=>incsDe(d).forEach(i=>{
      const l=(D.lst[d]||{})['i:'+i.id];
      rows.push([fdc(d),i.hom?'Homenaje':'Permiso',cohorteTxt(i),incModTxt(i),i.motivo+(i.det?': '+i.det:''),incAfectados(i).filter(x=>pred(x)).length,i.n||'',i.hom?'Lista del día en el '+modLabel(primerModInc(i)):i.mod===99?'—':i.mod===1?'Aviso':(l?'Cerrada '+l.h+' ('+(l.n||'')+')':'Pendiente')]);
    }));
    if(!rows.length)return {error:'No hay permisos de grupo en este periodo.'};
    return mk([{name:'Permisos',title:'Permisos y avisos de grupo ('+rows.length+')',cols:[C('Fecha',1.2),C('Tipo',1),C('Aplica a',2.2),C('Módulos',2.6),C('Motivo',2.6),C('Alumnos',.9,'c','n'),C('Registró',1.7),C('Lista',2)],rows,foots:[]}]);
  }
  const rows=[];
  Object.keys(D.lst).filter(d=>d>=a&&d<=b).sort().forEach(d=>Object.entries(D.lst[d]).sort().forEach(([g,l])=>{
    let label,ids;
    if(g.startsWith('i:')){const inc=(D.inc[d]||{})[g.slice(2)];if(!inc)return;label='Inician tarde: '+cohorteTxt(inc);ids=incAfectados(inc).filter(s=>pred(s)).map(s=>s.id)}
    else if(g.startsWith('t|')){const [,gr0,gp0,tec0]=g.split('|');label='Tecnología '+tec0+(gr0?' ('+gr0+'°'+gp0+')':'');ids=Object.values(D.al).filter(s=>!s.baja&&verAl(s)&&s.tec===tec0&&(!gr0||String(s.gr)===gr0)&&(!gp0||s.gp===gp0)&&pred(s)&&!diferido(s,d)).map(s=>s.id)}
    else{const gr=parseInt(g),gp=g.replace(/^\d+/,'');label=gr+'°'+gp;ids=Object.values(D.al).filter(s=>!s.baja&&verAl(s)&&s.gr===gr&&s.gp===gp&&pred(s)&&!diferido(s,d)).map(s=>s.id)}
    if(Array.isArray(l.ids)&&l.ids.length)ids=l.ids.filter(id=>D.al[id]&&verAl(D.al[id])&&pred(D.al[id]));
    if(!ids.length)return;
    const A=D.aul[d]||{},E=D.ent[d]||{};let p=0,n=0,ne=0;ids.forEach(id=>{if(A[id]&&A[id].s==='P')p++;else{n++;if(E[id])ne++}});
    rows.push([fdc(d),label,l.n||'',l.t==='P'?'Prefectura (suplencia)':'Docente',l.m||'—',l.md?'Módulo '+l.md:'—',l.h||'',l.por&&l.por!==l.n?l.por:(l.n||''),p,n,ne]);
  }));
  if(!rows.length)return {error:'No hay listas cerradas en este periodo.'};
  const sup=rows.filter(r=>r[3]!=='Docente').length;
  return mk([{name:'Listas',title:'Listas cerradas ('+rows.length+', '+sup+' en suplencia de Prefectura)',cols:[C('Fecha',1.1),C('Grupo',2.2),C('Pasó lista',2),C('Tipo',1.7),C('Motivo',2),C('Módulo',1,'c'),C('Hora',.7,'c'),C('Capturó',1.6),C('En aula',.8,'c','n'),C('No están',.8,'c','n'),C('Entraron y no están',1.2,'c','n')],rows,foots:[]}]);
};

const RULES_FB="{\n  \"rules\": {\n    \".read\": false,\n    \".write\": false,\n    \"s\": {\n      \"$sec\": {\n        \".read\": \"$sec.length >= 40\",\n        \".write\": \"$sec.length >= 40\"\n      }\n    },\n    \"e\": {\n      \"$esc\": {\n        \"upd\": {\n          \".read\": true,\n          \".write\": true\n        },\n        \"avisos\": {\n          \".read\": true,\n          \".write\": true\n        },\n        \"resp\": {\n          \".read\": true,\n          \".write\": true\n        },\n        \"ver\": {\n          \".read\": true,\n          \".write\": true\n        },\n        \"datos\": {\n          \".read\": true,\n          \".write\": true\n        },\n        \"sal\": {\n          \".read\": true,\n          \".write\": true\n        },\n        \"acc\": {\n          \"$id\": {\n            \".read\": \"$id.length >= 40\",\n            \".write\": \"$id.length >= 40\"\n          }\n        }\n      }\n    },\n    \"dir\": {\n      \"$kid\": {\n        \".read\": true,\n        \".write\": true\n      }\n    },\n    \"cod\": {\n      \"$c\": {\n        \".read\": true,\n        \".write\": \"!data.exists()\"\n      }\n    }\n  }\n}";
const CFG_MOV=['homenajes','homExc','cdLugares','cdMedios','cdExtra','cdFirmas','credCodigo','movilUrl','bdCats','updAuto','updAprobada','updDesde','updRech','listaPorModulo','trasladoMin','listaMin','retardoModo','cdTipos','cdNiveles','cdAcciones','cdUmbral','cdAvisoGrave','escuela','ciclo','horaEntrada','tolerancia','modulos','tecnologias','grados','grupos','nolab','confirmaAula','diasEdicion','idleMin','nombreFmt','tema','umbralFaltas'];
const b64u=u8=>b64(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>unb64(String(s).replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((String(s).length+3)%4));
const k64=k=>b64u(_te.encode(k));
const movilOk=u=>!!u&&u.rol!=='admin'&&(u.movil===true||(u.movil===undefined&&['docente','docentetec','prefecto'].includes(u.rol)));
const clUrl=a=>CL.cfg.url+'/e/'+CL.cfg.esc+a+'.json';
/* datos de la escuela: ruta secreta /s/<derivada de la clave> (v2) o la ruta anterior /e/<escuela> */
const clDUrl=a=>CL.cfg.url+(CL.cfg.v2&&CL.cfg.sec?'/s/'+CL.cfg.sec:'/e/'+CL.cfg.esc)+a+'.json';
async function fetchT(u,o,ms){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||15000);try{return await fetch(u,Object.assign({signal:ctl.signal},o||{}))}finally{clearTimeout(t)}}
function clArea(k){const m=k.match(/^([relximykg])\|(\d{4}-\d{2}-\d{2})\|/);return m?'/dia/'+m[2]:'/base'}
function clPermitido(k){
  const t=k[0];
  if(EDITION==='movil')return /^[relximykgu]$/.test(t);
  if(t==='a'||t==='u'||t==='w')return true;
  if(t==='c')return CFG_MOV.includes(k.slice(2));
  return /^[relximy]$/.test(t);
}
function clAcepta(o){
  if(!o||typeof o.k!=='string'||!o.p)return false;const t=o.k[0];
  if(EDITION==='movil')return /^[aucrelximyw]$/.test(t)&&(t!=='c'||CFG_MOV.includes(o.k.slice(2)));
  if(t==='u'){const u=D.users[o.k.slice(2)];return !!u&&u.rol!=='admin'&&o.p.t==='user'&&o.p.u&&o.p.u.rol===u.rol}
  return /^[relximykg]$/.test(t);
}
function clPayload(k,p){
  if(k[0]==='w'&&p.t==='per'&&p.rec){const r=p.rec;return {t:'per',id:p.id,rec:{id:r.id,u:r.u||'',n:r.n,rol:r.rol||'',tipo:r.tipo,a:r.a,b:r.b,todo:r.todo!==false,mods:r.mods||[],sup:r.sup||''}}}
  if(k[0]==='a'&&p.t==='al'){const a=p.a;return {t:'al',a:{id:a.id,mat:a.mat,nom:a.nom,ap:a.ap,am:a.am||'',sx:a.sx,gr:a.gr,gp:a.gp,tec:a.tec||'',baja:!!a.baja}}}
  if(k[0]==='u'&&p.t==='user'){
    const u=p.u;if(!u||u.rol==='admin')return null;
    if(!movilOk(u))return {t:'user',u:{id:u.id,usuario:'~'+u.id,nombre:'',rol:u.rol,permisos:[],grupos:[],activo:false,cambiar:false,salt:'AA==',iter:1,hash:'',movil:false}};
    return {t:'user',u:{id:u.id,usuario:u.usuario,nombre:u.nombre,rol:u.rol,permisos:u.permisos||[],grupos:u.grupos||[],tecs:u.tecs||[],activo:u.activo!==false,cambiar:!!u.cambiar,salt:u.salt,iter:u.iter,hash:u.hash,movil:true,creado:u.creado}};
  }
  return p;
}
function clEnqueue(k,ts,by,p,del){
  if(!CL.on||!clPermitido(k))return;
  const pl=clPayload(k,p);if(!pl)return;
  CL.out=CL.out.filter(x=>x.k!==k);CL.out.push(Object.assign({k,ts,by,p:pl},del?{del:1}:{}));
  clSoon();
}
function clSoon(){if(!CL.on)return;clearTimeout(CL.t);CL.t=setTimeout(()=>{clFlush().catch(e=>{CL.err=e.message||String(e);footNote()})},500)}
async function clFlush(){
  if(!CL.on||!CL.out.length||CL.ocupado||(typeof navigator!=='undefined'&&navigator.onLine===false))return;
  CL.ocupado=true;footNote();
  try{
    while(CL.out.length){
      const lote=CL.out.slice(0,60),por={};
      for(const o of lote){(por[clArea(o.k)]||(por[clArea(o.k)]={}))[k64(o.k)]={t:o.ts,d:DEV,c:b64(await cifrar(_te.encode(JSON.stringify(o)),CL.key))}}
      for(const [area,obj] of Object.entries(por)){const r=await fetchT(clDUrl(area),{method:'PATCH',body:JSON.stringify(obj)});if(!r.ok)throw new Error('La nube respondió '+r.status+'. Revisa las reglas de la Nube de SICET.')}
      CL.out=CL.out.slice(lote.length);await IDB.put('kv','clout',CL.out);
    }
    CL.ult=Date.now();CL.err='';
  }finally{CL.ocupado=false;footNote()}
}
async function clEvt(ev){
  if(!ev||ev.data==null||!CL.on)return;
  let items=[];
  if(ev.path==='/')items=Object.entries(ev.data);
  else{const seg=ev.path.slice(1).split('/');if(seg.length===1)items=[[seg[0],ev.data]]}
  let n=0;
  for(const [,v] of items){
    if(!v||!v.c)continue;
    try{const o=JSON.parse(_td.decode(await descifrar(unb64(v.c),CL.key)));if(clAcepta(o)&&aplicarRemoto(o,v.d)){n++;if(SY.activo)OUT.push(o)}}catch(e){/* ignorar */}
  }
  if(n){save();sesionRefrescar();if(SY.activo)syncSoon();uiTouched(true)}
}
async function clPoll(){
  if(!CL.on||(typeof navigator!=='undefined'&&navigator.onLine===false))return;
  for(let i=1;i<=3;i++){
    try{const r=await fetchT(clDUrl('/dia/'+addDays(todayISO(),i)),null,10000);if(!r.ok)continue;const j=await r.json();if(j)await clEvt({path:'/',data:j})}catch(e){/* siguiente intento */}
  }
}
function clClose(){CL.es.forEach(e=>{try{e.close()}catch(x){}});CL.es=[]}
function clOpen(){
  clClose();if(!CL.on)return;
  CL.hoy=todayISO();
  const paths=['/base','/dia/'+CL.hoy];
  paths.forEach(p=>{
    const es=new EventSource(clDUrl(p));CL.es.push(es);
    const h=e=>{try{clEvt(JSON.parse(e.data))}catch(x){}};
    es.addEventListener('put',h);es.addEventListener('patch',h);
    es.onopen=()=>{CL.err='';footNote()};es.onerror=()=>{CL.err='reconectando';footNote()};
  });
}
async function clSkew(){
  try{
    const u=clDUrl('/t/'+DEV),t0=Date.now();
    await fetchT(u,{method:'PUT',body:JSON.stringify({'.sv':'timestamp'})});
    const r=await fetchT(u),srv=await r.json(),t1=Date.now();
    if(typeof srv==='number')CL.skew=Math.round((t0+t1)/2-srv);
  }catch(e){/* opcional */}
}
async function clLimpiar(){
  if(EDITION==='movil'||!CL.on)return;
  try{
    const r=await fetchT(clDUrl('/dia')+'?shallow=true');const j=await r.json();
    const lim=addDays(todayISO(),-10);
    for(const d of Object.keys(j||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<lim)await fetchT(clDUrl('/dia/'+d),{method:'DELETE'});
  }catch(e){/* opcional */}
}
async function clLoad(){
  TRUST=(await IDB.get('kv','trust'))||[];
  const c=await IDB.get('kv','nube');CL.out=(await IDB.get('kv','clout'))||[];
  if(c&&c.url&&c.key){CL.cfg={url:c.url,esc:c.esc,pass:c.pass||'',sec:c.sec||'',v2:!!(c.v2&&c.sec),salt:c.salt||''};CL.key=c.key;CL.on=true}
}
function clStart(){
  if(!CL.on)return;
  clOpen();clFlush().catch(()=>{});clSkew().then(footNote);clLimpiar();clPoll();
  if(!CL.tl)CL.tl=setInterval(()=>{if(!CL.on)return;if(todayISO()!==CL.hoy)clOpen();clFlush().catch(()=>{});clPoll();if(!CL.es.length||CL.es.every(e=>e.readyState===2))clOpen()},30000);
}
async function clIniciar(url,esc,pass,crear){
  url=String(url||'').trim().replace(/\/+$/,'');
  if(!(/^https:\/\/[^\s]+$/.test(url)||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/[A-Za-z0-9_-]*)?$/.test(url)))throw new Error('La dirección debe empezar con https:// (la de la Nube de SICET: pestaña Data de la consola).');
  /* v2: los datos viven en una ruta secreta que solo se puede calcular con la clave de la nube */
  const sec=await clSec(pass,esc);let v2=false,base=url+'/e/'+esc,meta=null;
  try{const r=await fetchT(url+'/s/'+sec+'/meta.json');if(r.ok){meta=await r.json();if(meta&&meta.rev)meta=null;v2=true;base=url+'/s/'+sec}}catch(e){/* sin internet: se intenta abajo */}
  if(!v2||(!meta&&!crear)){
    try{const r=await fetchT(url+'/e/'+esc+'/meta.json');
      if(r.ok){const m=await r.json();if(m&&m.app==='AsisteMX'){meta=m;v2=false;base=url+'/e/'+esc}}
      else if(!v2){if(r.status===401||r.status===403)throw new Error('La nube bloqueó la lectura. Revisa que pegaste las reglas y pulsaste Publish.');throw new Error('La nube respondió '+r.status+'.')}
    }catch(e){if(!v2)throw new Error(e.message&&/nube/.test(e.message)?e.message:'No se pudo conectar con la nube. Revisa internet y la dirección.')}
  }
  let key;
  if(meta&&meta.app==='AsisteMX'){
    key=await claveSync(pass,meta.salt,meta.iter);
    try{if(_td.decode(await descifrar(unb64(meta.prueba),key))!=='AsisteMX')throw 0}catch(e){throw new Error('La clave de la nube no es correcta.')}
  }else{
    if(!crear)throw new Error('La nube todavía no tiene los datos de la escuela. Primero actívala en la computadora.');
    const salt=b64(crypto.getRandomValues(new Uint8Array(16)));key=await claveSync(pass,salt,210000);
    meta={app:'AsisteMX',v:v2?2:1,salt,iter:210000,prueba:b64(await cifrar(_te.encode('AsisteMX'),key)),creado:new Date().toISOString()};
    const r=await fetchT(base+'/meta.json',{method:'PUT',body:JSON.stringify(meta)});
    if(!r.ok)throw new Error('La nube rechazó la escritura ('+r.status+'). Revisa las reglas de la Nube de SICET.');
  }
  CL.cfg={url,esc,pass:EDITION==='movil'?'':pass,sec:v2?sec:'',v2,salt:meta.salt};CL.key=key;CL.on=true;
  await IDB.put('kv','nube',{url,esc,pass:CL.cfg.pass,key,sec:CL.cfg.sec,v2,salt:meta.salt});
}
async function clSec(pass,esc){
  const k=await crypto.subtle.importKey('raw',_te.encode(String(pass)),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:_te.encode('SICET-sec|'+esc),iterations:210000,hash:'SHA-256'},k,256);
  return 'S'+Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');
}
function clCodigo(){
  if(!CL.cfg||!CL.cfg.pass)return '';
  return 'SICET1.'+b64u(_te.encode(JSON.stringify({u:CL.cfg.url,e:CL.cfg.esc,p:CL.cfg.pass,k:(D.cfg.soporte||[])})));
}
async function clConectarMovil(code){
  const m=String(code||'').trim().match(/(?:SICET|AMX)1\.([A-Za-z0-9_-]+)/);if(!m)throw new Error('El código de conexión no es válido.');
  let o;try{o=JSON.parse(_td.decode(unb64u(m[1])))}catch(e){throw new Error('El código de conexión no es válido.')}
  await clIniciar(o.u,o.e,o.p,false);
  TRUST=Array.isArray(o.k)?o.k:[];await IDB.put('kv','trust',TRUST);
}
function encolarNube(){
  if(!CL.on||EDITION==='movil')return;
  const by=(ME&&ME.usuario)||'',lim=addDays(todayISO(),-3),ts0=k=>(META.get(k)&&META.get(k).ts)||1,add=(k,p,del)=>clEnqueue(k,ts0(k),by,p,del);
  for(const id in D.al)add('a|'+id,{t:'al',a:D.al[id]});
  for(const id in D.users)if(D.users[id].rol!=='admin')add('u|'+id,{t:'user',u:D.users[id]});
  for(const k of CFG_MOV)if(D.cfg[k]!==undefined)add('c|'+k,{t:'cfg',k,v:D.cfg[k]});
  for(const d in D.reg)if(d>=lim)for(const id in D.reg[d])add('r|'+d+'|'+id,{t:'reg',d,id,v:D.reg[d][id]});
  for(const d in D.ent)if(d>=lim)for(const id in D.ent[d])add('e|'+d+'|'+id,{t:'ent',d,id,rec:D.ent[d][id]});
  for(const d in D.aul)if(d>=lim)for(const id in D.aul[d])add('l|'+d+'|'+id,{t:'aul',d,id,rec:D.aul[d][id]});
  for(const d in D.lst)if(d>=lim)for(const g in D.lst[d])add('x|'+d+'|'+g,{t:'lst',d,g,rec:D.lst[d][g]});
  for(const d in D.inc)if(d>=lim)for(const id in D.inc[d])add('i|'+d+'|'+id,{t:'inc',d,id,rec:D.inc[d][id]});
  for(const id in D.per)if((D.per[id].b||D.per[id].a)>=lim)add('w|'+id,{t:'per',id,rec:D.per[id]});
  for(const d in D.mod)if(d>=lim)for(const m in D.mod[d])for(const id in D.mod[d][m])add('m|'+d+'|'+m+'|'+id,{t:'mod',d,m:Number(m),id,rec:D.mod[d][m][id]});
  for(const d in D.lstm)if(d>=lim)for(const k in D.lstm[d]){const i=k.indexOf('|');add('y|'+d+'|'+k.slice(0,i)+'|'+k.slice(i+1),{t:'lstm',d,m:Number(k.slice(0,i)),g:k.slice(i+1),rec:D.lstm[d][k]})}
}
function clEstado(){
  if(!CL.on)return {cls:'baddot',txt:'Sin conexión a la nube'};
  const pend=CL.out.length?' · '+CL.out.length+' por enviar':'';
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return {cls:'baddot',txt:'Sin internet'+pend};
  if(CL.err)return {cls:'baddot',txt:(CL.err==='reconectando'?'Reconectando…':'Error: '+CL.err)+pend};
  if(CL.ocupado)return {cls:'okdot',txt:'Enviando…'+pend};
  return {cls:'okdot',txt:'Conectado'+(CL.ult?' · '+new Date(CL.ult).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'')+pend};
}
const footNoteBase=footNote;
footNote=function(){
  footNoteBase();
  const f=$('#sidefoot');if(f&&CL.on&&ME&&ME.id){const e=clEstado();f.insertAdjacentHTML('beforeend','<div class="'+e.cls+'">'+(EDITION==='movil'?'':'Nube: ')+esc(e.txt)+'</div>')}
  const b=$('#mbar');if(b){const e=clEstado();b.innerHTML='<span class="'+e.cls+'">● '+esc(e.txt)+'</span>'+(Math.abs(CL.skew)>120000?' <span class="chip R">Revisa la hora del celular</span>':'')}
};
window.addEventListener('online',()=>{if(CL.on){clOpen();clFlush().catch(()=>{});clPoll();footNote()}});
window.addEventListener('offline',()=>footNote());

  }

Object.assign(ACT,{
  nbCopy:t=>{const x=$('#'+t.dataset.t);if(!x)return;x.select();try{document.execCommand('copy');toast('Copiado.')}catch(e){toast('Selecciona y copia manualmente.','err')}},

function condSerie(L,a,b){
  const hasta=b<todayISO()?b:todayISO(),dias=Math.max(1,(pd(hasta)-pd(a))/864e5+1),wk=dias>45,lun=d=>addDays(d,-((pd(d).getDay()+6)%7)),m=new Map();

  const def=REPS.find(r=>r.id===o.id),pred=filt(o),mk=sh=>({id:def.id,title:def.n,lines:hdrLines(o,def),sheets:sh});
  if(o.id!=='modulos'&&!can('conducta_todos'))return {error:'Tu cuenta no puede ver todos los reportes de conducta.'};

    const L=condFiltrados(Object.assign({},o,{niv:'',tp:'',est:''})).filter(r=>{const a=D.al[r.al];return !a||pred(a)||true});
    if(!L.length)return {error:'No hay reportes de conducta en este periodo.'};
    return mk([{name:'Reportes',title:'Reportes ('+L.length+')',cols:[C('Fecha',1.2),C('Hora',.7,'c'),C('Alumno',2.8),C('Grupo',.8,'c'),C('Tecnología',1.6),C('Nivel',1.3),C('Lugar',1.4),C('Conducta',3),C('Descripción',3.4),C('Acciones',2.2),...cdExtra().map(x=>C(x.n,1.6)),C('Tutor',1),C('Elaboró',2),C('Estado',1)],rows:L.map(r=>[fdc(r.d),r.h||'',condNombreAl(r.al,r),r.gr+'°'+r.gp,r.tec||'',r.niv,r.lug||'',(r.tipos||[]).join('; '),r.desc||'',(r.acc||[]).join('; '),...cdExtra().map(x=>cdExtraTxt(x,(r.ex||{})[x.id])),(r.tut&&r.tut.av)?'Avisado':'Pendiente',r.n||'',r.est==='atendido'?'Atendido':'Abierto']),foots:[]}]);
  }
  if(o.id==='conductaEst'){
    const L=condFiltrados(o);if(!L.length)return {error:'No hay reportes de conducta en este periodo.'};
    const s=condStats(L,o),tt=s.total,sh=(name,first,rows)=>({name,title:name,cols:[C(first,3),C('Reportes',1,'c','n'),C('%',1,'c','p')],rows:rows.map(([k,n])=>[k,n,n/tt*100]),foots:[['Total',tt,100]]});
    return mk([{name:'Resumen',title:'Resumen',cols:[C('Concepto',3),C('Valor',1.2,'c','n')],rows:[['Reportes en el periodo',tt],['Alumnos con reporte',s.alumnosN],...s.niv.map(([k,n])=>['Nivel: '+k,n]),['Abiertos',s.abiertos],['Leves y graves sin aviso al tutor',s.sinAviso],['Alumnos con '+s.umbral+' o más reportes',s.riesgo.length]],foots:[]},
      sh('Por tipo','Tipo de conducta',s.tipos),sh('Por grupo','Grupo',s.grupo),sh('Por grado','Grado',s.grado),...(tecList().length?[sh('Por tecnología','Tecnología',s.tec)]:[]),sh('Por módulo','Módulo',s.modulo),sh('Por docente','Docente que elabora',s.docente),
      {name:s.serie.wk?'Por semana':'Por día',title:s.serie.wk?'Reportes por semana':'Reportes por día',cols:[C(s.serie.wk?'Semana que inicia':'Fecha',2),C('Reportes',1,'c','n')],rows:s.serie.rows.map(([k,n])=>[fdc(k),n]),foots:[]},
      {name:'Alumnos con más reportes',title:'Alumnos con más reportes',cols:[C('Alumno',3.4),C('Grupo',1,'c'),C('Tecnología',1.6),C('Reportes',1,'c','n')],rows:s.alumnos.slice(0,40).map(([id,n])=>{const a=D.al[id];return [condNombreAl(id),a?grp(a):'',a?a.tec||'':'',n]}),foots:[]}]);
  }
  const [a,b]=rng(o),studs=activos().filter(pred).sort(cmpA),R={};let ntot=0;
  Object.keys(D.mod).filter(d=>d>=a&&d<=b).forEach(d=>Object.entries(D.mod[d]).forEach(([m,recs])=>Object.entries(recs).forEach(([id,r])=>{if(!D.al[id]||!pred(D.al[id]))return;const x=R[id]||(R[id]={P:0,T:0,N:0});x[r.s]++;ntot++})));
  if(!ntot)return {error:'No hay listas por módulo en este periodo.'};
  const rows=studs.filter(x=>R[x.id]).map((x,i)=>{const r=R[x.id],n=r.P+r.T+r.N;return [i+1,fullName(x),grp(x)+(x.tec?' · '+x.tec:''),n,r.P,r.T,r.N,(r.P+r.T)/n*100]});

let TRUST=[];
const UPD={cand:null,pend:null,solic:null,msg:'',busy:false,err:'',ult:0};
const SOP={priv:null,rec:null,esc:[],msg:''};
const RESP={dir:null,pass:'',nombre:'',ult:'',err:''};
const AVS={lista:[],vistos:new Set()};
const verOk=v=>/^\d+\.\d+\.\d+$/.test(String(v||''));
const verCmp=(a,b)=>{const x=String(a||'0').split('.').map(Number),y=String(b||'0').split('.').map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0};
const hex8=u8=>Array.from(u8,b=>b.toString(16).padStart(2,'0')).join('');
const sha256hex=async u8=>hex8(new Uint8Array(await crypto.subtle.digest('SHA-256',u8)));
async function gzip(u8){const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(u8).catch(()=>{});w.close().catch(()=>{});return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function gunzip(u8){if(typeof DecompressionStream==='undefined'&&window.pako)return window.pako.ungzip(u8);const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(u8).catch(()=>{});w.close().catch(()=>{});return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
/* el Administrador del sistema conserva el acceso a las escuelas de forma permanente */
const keyVigente=k=>true;
const trustList=()=>EDITION==='movil'?TRUST:(D.cfg.soporte||[]).filter(keyVigente);
const rechazada=v=>(D.cfg.updRech||[]).includes(v);
const offline=()=>typeof navigator!=='undefined'&&navigator.onLine===false;
const edK=ed=>ed==='movil'?'movil':'file';
const ver3=v=>String(v).replace(/\./g,'-');
function updMsgOf(m){const e=m.eds||{};return ['AMXUPD1',m.ver,m.fecha,m.notas||'',(e.file&&e.file.sha)||'-',(e.movil&&e.movil.sha)||'-'].join('\n')}
const importPub=k=>crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:k.x,y:k.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
async function verificarMeta(meta){
  if(!meta||!verOk(meta.ver)||!meta.sig||!meta.kid||!meta.eds)return null;
  const k=trustList().find(x=>x.kid===meta.kid);if(!k)return null;
  try{return (await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},await importPub(k),unb64(meta.sig),_te.encode(updMsgOf(meta))))?k:null}catch(e){return null}
}
const htmlInfo=txt=>{const v=txt.match(/const ASX_VERSION='(\d+\.\d+\.\d+)'/),e=txt.match(/const EDITION='(file|movil)'/);return {ver:v?v[1]:'',ed:e?e[1]:''}};
async function solicitudDe(meta){
  const a=meta&&meta.adm;if(!a||!a.x||!a.y||!meta.kid||!meta.sig||!verOk(meta.ver))return null;
  if((await sopKid(a.x,a.y))!==meta.kid)return null;
  try{const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},await importPub(a),unb64(meta.sig),_te.encode(updMsgOf(meta)));return ok?{kid:meta.kid,n:String(a.n||'').slice(0,60),x:a.x,y:a.y}:null}catch(e){return null}
}
async function updGuardarCand(meta,gzU8,k,reenviar){
  const sha=meta.eds[edK(EDITION)].sha,html=await gunzip(gzU8);
  if(await sha256hex(html)!==sha)throw new Error('El contenido no coincide con la firma.');
  const inf=htmlInfo(_td.decode(html));
  if(inf.ver!==meta.ver)throw new Error('La versión del archivo no coincide con la firmada.');
  if(inf.ed!==EDITION)throw new Error('El archivo no es para esta edición.');
  const cand={ver:meta.ver,fecha:meta.fecha,notas:meta.notas||'',kid:meta.kid,sig:meta.sig,msg:updMsgOf(meta),sha,x:k.x,y:k.y,n:k.n||'',gz:gzU8,ed:EDITION,ventana:meta.ventana||''};
  await IDB.put('kv','updCand_'+EDITION,cand);UPD.cand=cand;
  if(reenviar!==false&&SY.activo&&EDITION!=='movil')OUT.push({k:'p|upd',ts:nextTs(),by:(ME&&ME.usuario)||'',p:{t:'upd',meta,gz:b64(gzU8)}}),syncSoon();
  return cand;
}
async function updRecibirOp(p){
  try{
    if(!p||!p.meta||!p.gz)return;const meta=p.meta;
    if(verCmp(meta.ver,ASX_VERSION)<=0||(UPD.cand&&verCmp(UPD.cand.ver,meta.ver)>=0))return;
    const k=await verificarMeta(meta);if(!k||!meta.eds[edK(EDITION)])return;
    await updGuardarCand(meta,unb64(p.gz),k,false);updTratar();
  }catch(e){UPD.err=e.message||String(e)}
}
function updPermitida(ver){
  if(rechazada(ver))return false;
  if(!(D.cfg.updAuto===true||verCmp(D.cfg.updAprobada||'0',ver)>=0))return false;
  const d=D.cfg.updDesde;if(d&&Date.now()<Date.parse(d))return false;
  return true;
}
async function updMalas(){return (await IDB.get('kv','updBad_'+EDITION))||[]}
async function updActivar(){
  const c=UPD.cand;if(!c||verCmp(c.ver,ASX_VERSION)<=0)return false;
  if((await updMalas()).includes(c.ver))return false;
  const act=await IDB.get('kv','upd_'+EDITION);
  if(!(act&&verCmp(act.ver,c.ver)>=0)){if(act&&verCmp(act.ver,ASX_VERSION)>=0)await IDB.put('kv','updPrev_'+EDITION,act);await IDB.put('kv','upd_'+EDITION,c)}
  UPD.pend=(act&&verCmp(act.ver,c.ver)>=0)?act:c;updPintar();
  if(typeof locked!=='undefined'&&locked&&!SOP.priv&&!(ME&&ME.adm)&&!document.querySelector('#sk_p,#sk_n,#sc_zip,#sc_dat'))setTimeout(()=>location.reload(),500);
  return true;

async function updTratar(){
  if(UPD.busy)return;UPD.busy=true;
  try{
    if(!UPD.cand)UPD.cand=(await IDB.get('kv','updCand_'+EDITION))||null;
    const c=UPD.cand;
    if(c&&verCmp(c.ver,ASX_VERSION)<=0){await IDB.put('kv','updCand_'+EDITION,null);UPD.cand=null}
    else if(c&&updPermitida(c.ver))await updActivar();
    const act=await IDB.get('kv','upd_'+EDITION);
    if(act&&verCmp(act.ver,ASX_VERSION)>0)UPD.pend=act;else if(act&&verCmp(act.ver,ASX_VERSION)<=0&&!(await updMalas()).includes(act.ver))UPD.pend=null;
  }catch(e){UPD.err=e.message||String(e)}finally{UPD.busy=false;updPintar()}
}
async function updRevisar(){
  if(!CL.on||offline())return;
  try{
    const r=await fetchT(clUrl('/upd/latest'),null,10000);if(!r.ok)return;const meta=await r.json();UPD.ult=Date.now();
    if(!meta||!verOk(meta.ver)||verCmp(meta.ver,ASX_VERSION)<=0||rechazada(meta.ver))return;
    if(UPD.cand&&verCmp(UPD.cand.ver,meta.ver)>=0)return updTratar();
    if((await updMalas()).includes(meta.ver))return;
    const k=await verificarMeta(meta);
    if(!k){
      const s=EDITION!=='movil'?await solicitudDe(meta):null;
      if(s){UPD.solic=Object.assign({ver:meta.ver,fecha:meta.fecha,notas:meta.notas||'',ventana:meta.ventana||''},s);UPD.err='';updPintar();return}
      UPD.err='Hay una actualización '+meta.ver+' pero no está firmada por el Administrador autorizado.';updPintar();return;
    }
    UPD.solic=null;
    const ed=meta.eds[edK(EDITION)];if(!ed||!ed.n)return;
    const partes=[];for(let i=0;i<ed.n;i++){const rr=await fetchT(clUrl('/upd/v/'+ver3(meta.ver)+'/'+edK(EDITION)+'/'+i),null,20000);if(!rr.ok)throw new Error('No se pudo descargar la actualización.');partes.push(await rr.json())}
    await updGuardarCand(meta,unb64(partes.join('')),k);UPD.err='';
    await updTratar();
  }catch(e){UPD.err=e.message||String(e);updPintar()}
}

async function respaldoCargar(){const d=await IDB.get('kv','respDir');if(d){RESP.dir=d.dir||null;RESP.pass=d.pass||'';RESP.nombre=d.nombre||'';RESP.ult=d.ult||''}}
async function respaldoGuardar(){try{await IDB.put('kv','respDir',{dir:RESP.dir,pass:RESP.pass,nombre:RESP.nombre,ult:RESP.ult})}catch(e){try{await IDB.put('kv','respDir',{dir:null,pass:RESP.pass,nombre:RESP.nombre,ult:RESP.ult})}catch(x){}}}
async function respaldoAuto(motivo,interactivo){
  if(EDITION==='movil')return {ok:false,err:'No aplica en el celular.'};
  if(!RESP.dir)return {ok:false,err:'No hay carpeta de respaldos elegida.'};
  if(!RESP.pass)return {ok:false,err:'Falta la clave del respaldo.'};
  try{
    const h=RESP.dir;
    if(h.queryPermission){let pm=await h.queryPermission({mode:'readwrite'});if(pm!=='granted'&&interactivo&&h.requestPermission)pm=await h.requestPermission({mode:'readwrite'});if(pm!=='granted')return {ok:false,permiso:true,err:'La carpeta necesita tu permiso: pulsa «Respaldar ahora».'}}
    let out=_te.encode(JSON.stringify({app:'AsisteMX',version:3,fecha:new Date().toISOString(),motivo,datos:JSON.parse(JSON.stringify(D))}));
    const salt=b64(crypto.getRandomValues(new Uint8Array(16))),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await claveSync(RESP.pass,salt,210000),out));
    out=_te.encode(JSON.stringify({app:'AsisteMX',cifrado:true,salt,iv:b64(iv),datos:b64(ct)}));
    const d=new Date(),hh=n=>String(n).padStart(2,'0'),nom='SICET_respaldo_'+todayISO()+'_'+hh(d.getHours())+hh(d.getMinutes())+hh(d.getSeconds())+'_cifrado.json';
    const fh=await h.getFileHandle(nom,{create:true}),w=await fh.createWritable();await w.write(out);await w.close();
    const L=[];for await(const [n] of h.entries()){if(/^(?:SICET|AsisteMX)_respaldo_.*_cifrado\.json$/.test(n))L.push(n)}
    L.sort();const keep=Math.max(1,Number(D.cfg.respN)||14);for(const n of L.slice(0,Math.max(0,L.length-keep))){try{await h.removeEntry(n)}catch(e){}}
    RESP.ult=new Date().toISOString();RESP.err='';await respaldoGuardar();try{localStorage.setItem('asistemx_respaldo',todayISO())}catch(e){}
    bitacora('Respaldo automático en la carpeta «'+(RESP.nombre||'elegida')+'» ('+motivo+')');return {ok:true,nombre:nom};
  }catch(e){RESP.err=e.message||String(e);return {ok:false,err:RESP.err}}
}

}

const b64uJ=o=>b64u(_te.encode(JSON.stringify(o)));
const unb64uJ=s=>JSON.parse(_td.decode(unb64u(s)));
async function sopDerivar(frase,salt){
  const k=await crypto.subtle.importKey('raw',_te.encode(frase),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const sopKid=async(x,y)=>(await sha256hex(_te.encode(x+'.'+y))).slice(0,12);
async function sopCrearLlave(nombre,frase){
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const pub=await crypto.subtle.exportKey('jwk',kp.publicKey),priv=new Uint8Array(await crypto.subtle.exportKey('pkcs8',kp.privateKey));
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await sopDerivar(frase,salt),priv));
  const rec={fmt:'asxkey1',nombre,kid:await sopKid(pub.x,pub.y),pub:{x:pub.x,y:pub.y},salt:b64(salt),iv:b64(iv),ct:b64(ct),fecha:new Date().toISOString().slice(0,10)};
  await sopAgregarEnc(rec,frase);return rec;
}
async function sopAgregarEnc(rec,frase){
  const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
  const pub=await crypto.subtle.exportKey('jwk',kp.publicKey),priv=new Uint8Array(await crypto.subtle.exportKey('pkcs8',kp.privateKey));
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await sopDerivar(frase,unb64(rec.salt)),priv));
  rec.enc={x:pub.x,y:pub.y,iv:b64(iv),ct:b64(ct)};await IDB.put('kv','soporteKey',rec);
}
async function sopDesbloquear(rec,frase){
  try{const pk=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},await sopDerivar(frase,unb64(rec.salt)),unb64(rec.ct)));
    SOP.raw={sig:pk};SOP.priv=await crypto.subtle.importKey('pkcs8',pk,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);SOP.rec=rec;
    if(!rec.enc)await sopAgregarEnc(rec,frase);
    const ek=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.enc.iv)},await sopDerivar(frase,unb64(rec.salt)),unb64(rec.enc.ct)));
    SOP.raw.enc=ek;SOP.encPriv=await crypto.subtle.importKey('pkcs8',ek,{name:'ECDH',namedCurve:'P-256'},false,['deriveBits']);return true}catch(e){SOP.raw=null;return false}
}
const sopFirmar=async msg=>b64(new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},SOP.priv,_te.encode(msg))));
const sopCodigoAut=()=>'SICETK1.'+b64uJ({n:SOP.rec.nombre,x:SOP.rec.pub.x,y:SOP.rec.pub.y});
