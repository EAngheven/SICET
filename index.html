async function sopLeerArchivoLlave(f){
  const buf=await f.arrayBuffer(),h=new Uint8Array(buf,0,4);let txt;
  if(h[0]===0x50&&h[1]===0x4b){
    const rd=unzipIndex(buf),d=(await rd('llave-administrador.sicetkey'))||(await rd('llave-administrador.asxkey'));if(!d)throw new Error('El archivo comprimido no trae la llave.');txt=_td.decode(d);
  }else txt=_td.decode(new Uint8Array(buf));
  const r=JSON.parse(txt);if(r.fmt!=='asxkey1'||!r.ct||!r.pub)throw new Error('no es una llave');return r;
}

const impEcdhPub=(x,y)=>crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x,y,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[]);
async function hkdfAes(bits,salt,usages){
  const k=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt,info:_te.encode('AsisteMX datos v1')},k,{name:'AES-GCM',length:256},false,usages);

  const lo=o.min!=null?o.min:5,hi=o.max!=null?o.max:10,yy=v=>mt+ih-(v-lo)/(hi-lo)*ih,xx=i=>ml+(xl.length<2?iw/2:i*iw/(xl.length-1));

  xl.forEach((l,i)=>{g+='<text x="'+xx(i)+'" y="'+(H-8)+'" class="vz-ax" text-anchor="middle">'+esc(l)+'</text>'});

/* ====== homenajes y ceremonias cívicas ====== */
/* Un homenaje ocupa módulos de clase para todo el plantel (o algunos grupos): en esos módulos no hay clase en el aula,
   ningún grupo pasa lista y la lista del día se pasa en el primer módulo libre. La entrada al plantel se registra normal. */
const DIAS_L=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const homCfg=()=>Object.assign({on:false,dias:[1],hi:'07:00',hf:'07:50',desc:'Honores a la bandera'},(D&&D.cfg&&D.cfg.homenajes)||{});
const homModsDe=(hi,hf)=>(hi&&hf&&hi<hf)?classMods().filter(m=>m.i<hf&&m.f>hi).map(m=>m.n):[];
function homVirtuales(d){
  if(!D||!D.cfg||!d)return [];const h=homCfg();if(!h.on)return [];
  if(!(h.dias||[]).includes(pd(d).getDay()))return [];
  if((D.cfg.homExc||[]).includes(d)||isNoLab(d))return [];
  if(Object.values(D.inc[d]||{}).some(i=>i.hom))return [];
  const mods=homModsDe(h.hi,h.hf);if(!mods.length)return [];
  return [{id:'hom-'+d,virt:1,hom:1,amb:'plantel',grupos:[],tecs:[],grados:[],dia:false,mods,mod:1,motivo:'Homenaje o ceremonia cívica',det:h.desc||'',hi:h.hi,hf:h.hf,n:'Programado en Ajustes'}];
}
const homsDe=d=>incsDe(d).filter(i=>i.hom);
function homModsAl(a,d){const s=new Set();homsDe(d).forEach(i=>{if(cubre(i,a))(i.mods||[]).forEach(m=>s.add(m))});return s}
function primerModLibre(set){const L=classMods().map(m=>m.n);const n=L.find(m=>!set.has(m));return n||1}
const primerModAl=(a,d)=>a?primerModLibre(homModsAl(a,d)):1;
const primerModInc=i=>primerModLibre(new Set(i.mods||[]));
function homResumen(mods){
  const n=mods.length;if(!n)return 'Con ese horario no ocupa ningún módulo de clase.';
  const pm=primerModLibre(new Set(mods));
  return 'Ocupa <b>'+n+' módulo'+(n===1?'':'s')+'</b>: '+esc(modsTxt(mods))+'. En '+(n===1?'ese módulo':'esos módulos')+' los alumnos no están en el aula y <b>no se pasa lista</b>.'+(mods.includes(1)?' La lista del día se pasa en el <b>'+esc(modLabel(pm))+'</b>.':' La lista del día no cambia (módulo 1).')+' La entrada al plantel se registra normal: llegar tarde al homenaje sí cuenta como retardo.';
}
function homHoyBanner(t){
  const L=homsDe(t);if(!L.length)return '';
  return L.map(i=>'<div class="warnbox hombox"><b>Hoy hay homenaje'+(i.det?': '+esc(i.det):'')+'</b> · '+esc(i.hi&&i.hf?i.hi+'–'+i.hf:'')+' · '+esc(cohorteTxt(i))+'<br>'+homResumen(i.mods||[])+'</div>').join('');
}
function homModal(d,rec){
  rec=rec||{};const h=homCfg(),grs=[];D.cfg.grados.forEach(g=>D.cfg.grupos.forEach(p=>grs.push(g+p)));
  const hi=rec.hi||h.hi,hf=rec.hf||h.hf,DES=['Honores a la bandera','Ceremonia cívica','Acto conmemorativo','Evento escolar en el patio'];
  openModal('<h2>Registrar homenaje</h2><p class="hint">Indica la fecha y el horario. SICET calcula cuántos módulos ocupa, los marca en los permisos de grupo y mueve la lista del día al primer módulo libre.</p>'+
   '<div class="form"><label>Fecha<input type="date" id="hm_d" value="'+(d||todayISO())+'"></label><label>Hora de inicio<input type="time" id="hm_i" value="'+esc(hi)+'"></label><label>Hora de término<input type="time" id="hm_f" value="'+esc(hf)+'"></label>'+

   '<label class="full">A quién aplica<select id="hm_a"><option value="plantel">Todo el plantel (todos los grupos)</option><option value="grupos">Solo algunos grupos</option></select></label>'+
   '<div class="full" id="hm_g" style="display:none"><span class="note">Grupos</span><div class="chips">'+grs.map(g=>'<label class="chk"><input type="checkbox" name="hmg" value="'+esc(g)+'">'+esc(gTxt(g))+'</label>').join('')+'</div></div>'+
   '<div class="full"><span class="note">Módulos que ocupa (se marcan solos según el horario; puedes ajustarlos)</span><div class="chips" id="hm_m">'+classMods().map(m=>'<label class="chk"><input type="checkbox" name="hmm" value="'+m.n+'">Módulo '+m.n+' ('+m.i+'–'+m.f+')</label>').join('')+'</div></div></div>'+
   '<div class="warnbox" id="hm_res" style="background:var(--Js);border-color:var(--J)"></div><p class="note" id="hm_cnt"></p>'+
   '<div class="mfoot"><button class="btn" data-act="closemodal">Cancelar</button><button class="btn pri" id="mOk">Registrar homenaje</button></div>');
  let manual=false;

  const sel=()=>({amb:$('#hm_a').value,grupos:[...document.querySelectorAll('#hm_g input:checked')].map(x=>x.value),tecs:[],grados:[],mods:[...document.querySelectorAll('#hm_m input:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b)});
  const upd=()=>{if(!$('#hm_a'))return;const v=sel();$('#hm_g').style.display=v.amb==='grupos'?'':'none';$('#hm_ow').style.display=$('#hm_t').value===''?'':'none';$('#hm_res').innerHTML=homResumen(v.mods);const n=activos().filter(a=>cubre(v,a)).length;$('#hm_cnt').textContent='Aplica a '+n+' alumno'+(n===1?'':'s')+'.'};
  marcar();upd();
  $('#hm_i').addEventListener('change',()=>{if(!manual)marcar();upd()});$('#hm_f').addEventListener('change',()=>{if(!manual)marcar();upd()});
  $('#hm_m').addEventListener('change',()=>{manual=true;upd()});$('#sheet').onchange=upd;
  $('#mOk').onclick=()=>{
    const v=sel(),dd=$('#hm_d').value,i=$('#hm_i').value,f=$('#hm_f').value,det=$('#hm_t').value||$('#hm_o').value.trim()||'Homenaje';
    if(!dd)return toast('Elige la fecha.','err');if(!i||!f||i>=f)return toast('Revisa el horario: la hora de inicio debe ser menor que la de término.','err');

    if(!v.mods.length)return toast('Marca al menos un módulo (o ajusta el horario).','err');
    const r=Object.assign({id:'hm'+hexR(4),hom:1,dia:false,mod:1,motivo:'Homenaje o ceremonia cívica',det,hi:i,hf:f,u:ME.id,n:ME.nombre,ts:Date.now()},v);
    if(!commit({t:'inc',d:dd,id:r.id,rec:r}))return;
    if((D.cfg.homExc||[]).includes(dd)&&can('ajustes'))commit({t:'cfg',k:'homExc',v:D.cfg.homExc.filter(x=>x!==dd)});
    bitacora('Homenaje '+dd+' '+i+'–'+f+': '+det+' ('+modsTxt(v.mods)+')');
    closeModal();toast('Homenaje registrado: ocupa '+v.mods.length+' módulo'+(v.mods.length===1?'':'s')+'.');render();
  };
}
function homAjPanel(){

/* Casi todos los lectores funcionan «como teclado» (HID): escriben el código muy rápido y terminan con Enter o Tab.
   SICET los detecta en la pantalla «Entrada» aunque el cursor no esté en el cuadro. Si el lector está configurado con
   otra distribución de teclado, el separador «|» puede llegar como «}», «°», «¬», «~»…: se acepta cualquiera. */
function normCodigo(raw){
  let s=String(raw||'').replace(/[\u0000-\u001f\u007f]/g,'').trim();
  s=s.replace(/^\][A-Za-z]\d/,'');
  const m=s.match(/A\s*S\s*I\s*S\s*T[^A-Za-z0-9]{0,2}([A-Za-z0-9][A-Za-z0-9._\-\/]*)/i);
  if(m)return m[1];
  return s.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,'');
}

document.addEventListener('keydown',e=>{
  if(typeof U==='undefined'||U.tab!=='scan'||locked||!$('#modal').hidden)return;
  const t=e.target,tag=t&&t.tagName;
  if(t&&t.id==='manual')return;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const now=performance.now();
  if(e.key==='Enter'||e.key==='Tab'){
    if(LECTOR.buf.length>=3&&(now-LECTOR.t0)/LECTOR.buf.length<70){e.preventDefault();const code=LECTOR.buf;LECTOR.buf='';clearTimeout(LECTOR.timer);if(LECTOR.prueba)return lectorPruebaRes(code);handleScan(code,true)}
    LECTOR.buf='';return;
  }
  if(e.key.length!==1)return;
  if(!LECTOR.buf||now-LECTOR.last>120){LECTOR.buf='';LECTOR.t0=now}
  LECTOR.buf+=e.key;LECTOR.last=now;
  clearTimeout(LECTOR.timer);
  LECTOR.timer=setTimeout(()=>{const b=LECTOR.buf;if(b.length>=4&&(LECTOR.last-LECTOR.t0)/b.length<40){LECTOR.buf='';if(LECTOR.prueba)lectorPruebaRes(b);else handleScan(b,true)}else LECTOR.buf=''},180);
},true);

async function lectorSerie(){
  if(!('serial' in navigator))return toast('Este navegador no permite lectores serie. Usa Chrome o Edge en computadora.','err');
  try{
    const port=await navigator.serial.requestPort();await port.open({baudRate:9600});LECTOR.port=port;LECTOR.serial='9600';toast('Lector serie conectado.');render();
    const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable).catch(()=>{});const rd=dec.readable.getReader();LECTOR.reader=rd;let acc='';
    for(;;){const {value,done}=await rd.read();if(done)break;acc+=value;let i;while((i=acc.search(/[\r\n]/))>=0){const line=acc.slice(0,i).trim();acc=acc.slice(i+1);if(line){if(LECTOR.prueba)lectorPruebaRes(line);else handleScan(line,true)}}}
  }catch(e){if(e&&e.name!=='NotFoundError')toast('No se pudo abrir el lector serie: '+(e.message||e.name),'err');LECTOR.port=null;render()}

function code128(txt){
  txt=String(txt);const num=/^\d+$/.test(txt)&&txt.length%2===0&&txt.length>=4;let codes;
  if(num){codes=[105];for(let i=0;i<txt.length;i+=2)codes.push(Number(txt.substr(i,2)))}
  else{codes=[104];for(const ch of txt){const c=ch.charCodeAt(0);codes.push(c>=32&&c<=127?c-32:0)}}
  let sum=codes[0];for(let i=1;i<codes.length;i++)sum+=codes[i]*i;codes.push(sum%103);codes.push(106);
  return codes.map(c=>C128[c]).join('');
}
function code128SVG(txt){
  const pat=code128(txt);let x=10,d='';
  for(let i=0;i<pat.length;i++){const w=Number(pat[i]);if(i%2===0)d+='M'+x+' 0h'+w+'v40h-'+w+'z';x+=w}
  const W=x+10;
  return '<svg class="b128" viewBox="0 0 '+W+' 52" preserveAspectRatio="none" role="img" aria-label="Código de barras '+esc(txt)+'"><rect width="'+W+'" height="52" fill="#fff"/><path d="'+d+'" fill="#000"/><text x="'+W/2+'" y="50.5" font-size="9" text-anchor="middle" font-family="monospace" fill="#000">'+esc(txt)+'</text></svg>';
}

function iconoSVG(size,mask){
  const sym=document.getElementById('sx-icon');if(!sym)return '';
  const pad=mask?0.24:0.17,s=size*(1-2*pad)/1253,off=size/2-639.5*s;
  const inner=sym.innerHTML.replace(/var\(--sx-main,#0F4D5C\)/g,'#FFFFFF').replace(/var\(--sx-eraser,#0F4D5C\)/g,'#FFFFFF').replace(/var\(--sx-cone,#F4D6A0\)/g,'#FFFFFF');

}
function svgPng(svg,size){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(im,0,0,size,size);c.toBlob(b=>b?b.arrayBuffer().then(x=>res(new Uint8Array(x))):rej(new Error('png')),'image/png')};im.onerror=()=>rej(new Error('svg'));im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
const SW_TXT="// SICET Móvil: guarda solo la aplicación (HTML, íconos y el lector de QR). Nunca guarda datos de alumnos.\nconst C='sicet-movil-v41';\nconst SHELL=['./','index.html','manifest.webmanifest','icon-192.png','icon-512.png','apple-touch-icon.png'];\nself.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(SHELL).catch(()=>{})).then(()=>self.skipWaiting()))});\nself.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});\nself.addEventListener('fetch',e=>{\n  const r=e.request,u=new URL(r.url);\n  if(r.method!=='GET')return;\n  const mismo=u.origin===self.location.origin,jsqr=u.hostname==='cdnjs.cloudflare.com';\n  if(!mismo&&!jsqr)return;\n  if(/event-stream/.test(r.headers.get('accept')||'')||/\\.json$/.test(u.pathname))return;\n  e.respondWith(fetch(r).then(res=>{if(res.ok){const cp=res.clone();caches.open(C).then(c=>c.put(r,cp))}return res}).catch(()=>caches.match(r).then(m=>m||(r.mode==='navigate'?caches.match('index.html'):undefined))));\n});\n";

let QRS=null;
function qrStop(){if(QRS){clearTimeout(QRS.t);if(QRS.s)QRS.s.getTracks().forEach(t=>t.stop());QRS=null}}
async function qrLeer(cb){
  const w=$('#cqrw'),v=$('#cqv'),m=$('#cqm');if(!w)return;w.hidden=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){m.textContent='Este navegador no permite usar la cámara aquí. Pega el código a mano.';return}
  let bd=null;if('BarcodeDetector' in window){try{bd=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  if(!bd&&!window.jsQR){m.textContent='Preparando el lector…';await loadJsQR()}
  if(!bd&&!window.jsQR){m.textContent='No se pudo cargar el lector de QR (revisa internet). Pega el código a mano.';return}
  try{qrStop();QRS={s:await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}),t:null};v.srcObject=QRS.s;await v.play();m.textContent='Apunta al código QR que te muestra Dirección.'}catch(e){m.textContent='No se pudo abrir la cámara. Revisa el permiso o pega el código a mano.';return}
  const loop=async()=>{if(!QRS)return;try{if(v.readyState>=2&&v.videoWidth){let r=null;if(bd){const x=await bd.detect(v);r=x&&x[0]&&x[0].rawValue}else{const c=$('#cqc'),k=Math.min(1,720/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(v,0,0,c.width,c.height);const q=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});r=q&&q.data}if(r&&cb(r)){qrStop();return}}}catch(e){}if(QRS)QRS.t=setTimeout(loop,150)};loop();
}

/* ====== Calificaciones: 3 trimestres, tablero con semáforo y proyección (pestaña oculta) ====== */
U.cf={vista:'tablero',tr:'F',gr:'',gp:'',tec:'',s:'',al:'',q:''};
const _initU1=initU;initU=function(){_initU1();U.cf={vista:'tablero',tr:'F',gr:'',gp:'',tec:'',s:'',al:'',q:''};U.rs={gr:'',gp:'',tec:'',niv:'',cat:'',est:'seg',q:'',vista:'tablero'}};
const calVals=(a,s)=>((D.cal[a.id]||{})[s])||[null,null,null];
const avg=L=>{const v=L.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((t,x)=>t+x,0)/v.length:null};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function asigAl(a){const L=asigDe(a.gr).slice();return L}
/* valor de una asignatura en el periodo pedido: tr = 1,2,3 o 'F' (promedio de los trimestres capturados) */
const calV=(a,s,tr)=>{const v=calVals(a,s);return tr==='F'?avg(v):v[tr-1]};
function calAlumno(a,tr){
  const L=asigAl(a),vals=L.map(s=>calV(a,s,tr)),cap=vals.filter(v=>v!=null);
  const prom=avg(vals),repr=L.filter((s,i)=>vals[i]!=null&&vals[i]<calMinV());
  const tri=[1,2,3].map(t=>avg(L.map(s=>calV(a,s,t))));
  /* proyección del promedio final: si falta el 3er trimestre se estima con la tendencia de los anteriores */
  const proyA=L.map(s=>{const v=calVals(a,s);if(v[2]!=null)return avg(v);if(v[0]!=null&&v[1]!=null)return avg([v[0],v[1],clamp(v[1]+(v[1]-v[0])*0.5,calMinV()-1,calMaxV())]);return avg(v)});
  const proy=avg(proyA),proyRepr=L.filter((s,i)=>proyA[i]!=null&&proyA[i]<calMinV()).length;
  return {L,vals,prom,repr,cap:cap.length,tot:L.length,tri,proy,proyRepr,tend:tri[1]!=null&&tri[0]!=null?(tri[2]!=null?tri[2]-tri[1]:tri[1]-tri[0]):null};
}
const calFilt=()=>{const o=U.cf;return activos().filter(a=>(!o.gr||eq(a.gr,o.gr))&&(!o.gp||eq(a.gp,o.gp))&&(!o.tec||a.tec===o.tec)).sort(cmpA)};
const trTxt=tr=>tr==='F'?'Promedio anual (trimestres capturados)':calPer()[tr-1];
const nivCal=c=>c.prom==null?'N':c.prom<calMinV()||(c.proy!=null&&c.proy<calMinV())?'F':(c.prom<calAlertaV()||c.repr.length)?'R':'P';
const nivCalTxt={F:'No alcanza el promedio',R:'Próximo a no alcanzarlo',P:'Bien',N:'Sin calificaciones'};
function calFiltros(cap){
  const o=U.cf;
  return '<div class="filters"><label>Periodo<select data-b="cf.tr">'+(cap?'':'<option value="F"'+(o.tr==='F'?' selected':'')+'>Promedio anual</option>')+calPer().map((p,i)=>'<option value="'+(i+1)+'"'+(String(o.tr)===String(i+1)?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select></label>'+
   '<label>Grado<select data-b="cf.gr">'+optGr(o.gr,!cap)+'</select></label><label>Grupo<select data-b="cf.gp">'+optGp(o.gp,true)+'</select></label>'+(tecList().length?'<label>Tecnología<select data-b="cf.tec">'+optTec(o.tec)+'</select></label>':'')+
   (cap?'<label>Asignatura<select data-b="cf.s"><option value="">Todas (sábana del periodo)</option>'+asigDe(o.gr||D.cfg.grados[0]).map(s=>'<option'+(o.s===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></label>':'')+'</div>';
}
VIEWS.calif=()=>{
  if(!verOculto('calif'))return '<div class="empty">No tienes acceso a esta sección.</div>';
  const o=U.cf;if(o.vista==='captura'&&!o.gr)o.gr=String(myGr()[0]||'');if(o.vista==='captura'&&o.tr==='F')o.tr=1;
  const tab=(k,l)=>'<button class="'+(o.vista===k?'on':'')+'" data-act="cfVista" data-v="'+k+'">'+l+'</button>';
  const head='<div class="head"><div><h2>Calificaciones <span class="chip J">Confidencial</span></h2><p>Los 3 trimestres por grado, grupo, tecnología y alumno, con semáforo: <span class="chip F">no alcanza '+f1(calMinV())+'</span> <span class="chip R">menos de '+f1(calAlertaV())+' o con materias no aprobadas</span> <span class="chip P">bien</span></p></div><div class="segtabs" role="tablist">'+tab('tablero','Tablero')+(editOculto('calif')?tab('captura','Captura'):'')+tab('alumno','Por alumno')+'</div></div>';
  if(o.vista==='captura'&&editOculto('calif'))return head+calCaptura();
  if(o.vista==='alumno')return head+calAlumnoVista();
  return head+calTablero();
};
function calTablero(){
  const o=U.cf,tr=o.tr==='F'?'F':Number(o.tr),studs=calFilt(),R=studs.map(a=>({a,c:calAlumno(a,tr)})),conCal=R.filter(x=>x.c.prom!=null);
  if(!conCal.length)return calFiltros(false)+'<div class="empty"><b>Todavía no hay calificaciones '+(tr==='F'?'':'en el '+esc(trTxt(tr)))+' con estos filtros</b><br>'+(editOculto('calif')?'Captúralas en «Captura» o cárgalas desde Excel.<br><button class="btn pri" data-act="cfVista" data-v="captura" style="margin-top:12px">Ir a captura</button>':'Pide al Administrador o a quien captura que las registre.')+'</div>';
  const gen=avg(conCal.map(x=>x.c.prom)),noAlc=conCal.filter(x=>x.c.prom<calMinV()),prox=conCal.filter(x=>x.c.prom>=calMinV()&&x.c.prom<calAlertaV()),conRep=conCal.filter(x=>x.c.repr.length),proyNo=R.filter(x=>x.c.proy!=null&&x.c.proy<calMinV());
  const esp=R.reduce((n,x)=>n+x.c.tot,0),cap=R.reduce((n,x)=>n+x.c.cap,0);
  /* mapa de calor grupo × asignatura */
  const grps=groupsOf(studs),cols=[...new Set(grps.flatMap(g=>asigDe(g[0].gr)))];
  const cell=(g,s)=>{const vs=g.map(a=>asigDe(a.gr).includes(s)?calV(a,s,tr):null).filter(v=>v!=null);if(!vs.length)return {v:null,n:0,no:0};return {v:avg(vs),n:vs.length,no:vs.filter(v=>v<calMinV()).length}};
  const heat='<div class="panel"><h3>Mapa de calor: grupo × asignatura</h3><p class="sub">'+esc(trTxt(tr))+'. Cada celda es el promedio del grupo en la asignatura; toca una celda para ver o capturar sus calificaciones.</p><div class="twrap"><table class="heat"><thead><tr><th class="l">Grupo</th>'+cols.map(s=>'<th title="'+esc(s)+'"><span>'+esc(s.length>14?s.slice(0,13)+'…':s)+'</span></th>').join('')+'<th>Promedio</th></tr></thead><tbody>'+
   grps.map(g=>{const pg=avg(g.map(a=>calAlumno(a,tr).prom));return '<tr><th class="l">'+esc(grp(g[0]))+'</th>'+cols.map(s=>{const c=cell(g,s);if(c.v==null)return '<td class="hc N">—</td>';const e=calEst(c.v);return '<td class="hc '+e+'" data-act="cfCell" data-g="'+esc(String(g[0].gr)+g[0].gp)+'" data-s="'+esc(s)+'" data-tip="<b>'+esc(grp(g[0]))+' · '+esc(s)+'</b><br>'+esc(trTxt(tr))+': <b>'+f1(c.v)+'</b> ('+calEstTxt[e]+')<br>'+c.no+' de '+c.n+' alumnos no aprobados">'+f1(c.v)+'</td>'}).join('')+'<td class="hc '+calEst(pg)+' tot">'+f1(pg)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  /* tendencia por grado */
  const grados=[...new Set(studs.map(a=>a.gr))].sort((x,y)=>x-y).slice(0,3);
  const lineas=vzLineas(grados.map(g=>({n:g+'° grado',vals:[1,2,3].map(t=>avg(studs.filter(a=>a.gr===g).map(a=>calAlumno(a,t).prom)))})),calPer(),{min:Math.min(5,Math.floor(calMinV())-1),max:calMaxV(),refs:[{v:calMinV(),c:'F',t:'Mínimo '+f1(calMinV())},{v:calAlertaV(),c:'R',t:'Alerta '+f1(calAlertaV())}],aria:'Promedio por trimestre y grado'});
  /* por tecnología y por grupo */
  const tecs=tecList().map(t=>({l:t,R:conCal.filter(x=>x.a.tec===t)})).filter(x=>x.R.length).map(x=>({l:x.l,v:avg(x.R.map(y=>y.c.prom)),sub:x.R.length+' alumnos',tip:'<b>'+esc(x.l)+'</b><br>Promedio '+f1(avg(x.R.map(y=>y.c.prom)))+'<br>'+x.R.filter(y=>y.c.prom<calMinV()).length+' no alcanzan el promedio'})).sort((a,b)=>b.v-a.v);
  const porGrupo=grps.map(g=>{const L=conCal.filter(x=>g.includes(x.a));return {l:grp(g[0]),v:avg(L.map(y=>y.c.prom)),sub:L.length+' alumnos'}}).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  const refs=[{v:calMinV(),c:'F',t:'Mínimo'},{v:calAlertaV(),c:'R',t:'Alerta'}],bo={min:5,max:calMaxV(),est:calEst,refs};
  /* distribución */
  const bins=[['Menos de '+f1(calMinV()),x=>x<calMinV(),'F'],[f1(calMinV())+' a '+f1(calAlertaV()-0.1),x=>x>=calMinV()&&x<calAlertaV(),'R'],[f1(calAlertaV())+' a 7.9',x=>x>=calAlertaV()&&x<8,'P'],['8 a 8.9',x=>x>=8&&x<9,'P'],['9 a 10',x=>x>=9,'P']];
  const dist=vzColumnas(bins.map(([l,f,e])=>({l,v:conCal.filter(x=>f(x.c.prom)).length,e})),{u:'alumnos'});
  /* alumnos en alerta */
  const alerta=R.filter(x=>x.c.prom!=null&&(nivCal(x.c)!=='P')).sort((x,y)=>(x.c.prom-y.c.prom));
  const verR=verOculto('riesgo')&&editOculto('riesgo');
  const tabla=alerta.length?'<div class="twrap"><table><thead><tr><th class="l">Alumno</th><th>Grupo</th>'+calPer().map((p,i)=>'<th>T'+(i+1)+'</th>').join('')+'<th>Tendencia</th><th>Promedio</th><th>Proyección</th><th class="l">No aprobadas</th><th class="l">Estado</th><th></th></tr></thead><tbody>'+alerta.slice(0,200).map(({a,c})=>{const e=nivCal(c);return '<tr><td class="l"><button class="link" data-act="cfAl" data-id="'+a.id+'">'+esc(fullName(a))+'</button></td><td>'+grp(a)+(a.tec?'<br><span class="note">'+esc(a.tec)+'</span>':'')+'</td>'+c.tri.map(v=>'<td class="'+(v==null?'':'c'+calEst(v))+'">'+f1(v)+'</td>').join('')+'<td>'+vzSpark(c.tri)+'</td><td><b class="c'+calEst(c.prom)+'">'+f1(c.prom)+'</b></td><td class="'+(c.proy!=null&&c.proy<calMinV()?'cF':'')+'">'+f1(c.proy)+'</td><td class="l" style="white-space:normal;max-width:240px"'+(c.repr.length?' data-tip="'+esc(esc(c.repr.join(', ')))+'"':'')+'>'+(c.repr.length?'<b>'+c.repr.length+'</b> · '+esc(c.repr.slice(0,2).join(', '))+(c.repr.length>2?'…':''):'—')+'</td><td class="l"><span class="chip '+e+'">'+nivCalTxt[e]+'</span></td><td>'+(verR?'<button class="btn sm" data-act="rsgAbrir" data-id="'+a.id+'">Seguimiento</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>'+(alerta.length>200?'<p class="note" style="padding:8px 14px">Se muestran 200 de '+alerta.length+'.</p>':''):'<div class="empty" style="padding:16px">Ningún alumno en alerta con estos filtros.</div>';
  return calFiltros(false)+
   '<div class="stats"><div class="stat big"><span>Promedio general</span><b class="c'+calEst(gen)+'">'+f1(gen)+'</b><small>'+esc(trTxt(tr))+'</small></div><div class="stat"><span>No alcanzan el promedio</span><b class="cF">'+noAlc.length+'</b><small>menos de '+f1(calMinV())+'</small></div><div class="stat"><span>Próximos a no alcanzarlo</span><b class="cR">'+prox.length+'</b><small>de '+f1(calMinV())+' a '+f1(calAlertaV()-0.1)+'</small></div><div class="stat"><span>Con materias no aprobadas</span><b class="cR">'+conRep.length+'</b><small>de '+conCal.length+' alumnos</small></div><div class="stat"><span>Proyección de fin de año</span><b class="'+(proyNo.length?'cF':'cP')+'">'+proyNo.length+'</b><small>podrían no acreditar</small></div><div class="stat"><span>Avance de captura</span><b>'+(esp?Math.round(cap/esp*100):0)+'%</b><small>'+cap+' de '+esp+' calificaciones</small></div></div>'+
   (noAlc.length||proyNo.length?'<div class="warnbox alerta"><b>Alerta para la institución:</b> '+noAlc.length+' alumno'+(noAlc.length===1?'':'s')+' no alcanza'+(noAlc.length===1?'':'n')+' el promedio mínimo y '+proyNo.length+' podría'+(proyNo.length===1?'':'n')+' no acreditar el ciclo según la tendencia. Revisa la lista de abajo'+(verR?' y envíalos a «Alerta temprana»':'')+'.</div>':'')+
   '<div class="actions" style="margin-bottom:16px"><button class="btn" data-act="cfRep" data-k="conc">Concentrado por grupo (PDF o Excel)</button><button class="btn" data-act="cfRep" data-k="alerta">Alumnos en alerta (PDF o Excel)</button></div>'+
   heat+'<div class="grid2"><div class="panel"><h3>Tendencia por trimestre</h3><p class="sub">Promedio general de cada grado en los tres trimestres.</p><div class="body">'+lineas+'</div></div><div class="panel"><h3>Distribución de promedios</h3><p class="sub">Cuántos alumnos hay en cada rango de promedio · '+esc(trTxt(tr))+'.</p><div class="body">'+dist+'</div></div>'+
   (tecs.length?'<div class="panel"><h3>Por tecnología</h3><p class="sub">Promedio de los alumnos de cada taller.</p><div class="body">'+vzBarrasH(tecs,bo)+'</div></div>':'')+'<div class="panel"><h3>Por grupo</h3><p class="sub">Del mejor al más bajo.</p><div class="body">'+vzBarrasH(porGrupo,bo)+'</div></div></div>'+
   '<div class="panel"><h3>Alumnos que no alcanzan o están por no alcanzar el promedio <span class="chip '+(alerta.length?'F':'N')+'">'+alerta.length+'</span></h3><p class="sub">La proyección estima el promedio final con la tendencia entre trimestres. Úsala para acompañar a tiempo, no para etiquetar.</p>'+tabla+'</div>';
}
function calCaptura(){
  const o=U.cf,tr=Number(o.tr)||1,studs=calFilt().filter(a=>!o.gr||eq(a.gr,o.gr));
  if(!o.gp)return calFiltros(true)+'<div class="warnbox">Elige un grupo para capturar.</div>'+calImportHTML();
  const L=asigDe(o.gr),s=o.s&&L.includes(o.s)?o.s:'';
  const inp=(a,sx,t)=>{const v=calVals(a,sx)[t-1];return '<input class="calin '+(v==null?'':calEst(v))+'" type="number" inputmode="decimal" step="0.1" min="0" max="'+calMaxV()+'" data-cal="'+a.id+'|'+esc(sx)+'|'+t+'" value="'+(v==null?'':v)+'" aria-label="'+esc(fullName(a)+' · '+sx+' · '+calPer()[t-1])+'">'};
  const grid=s?'<div class="twrap"><table class="calgrid"><thead><tr><th class="l">Alumno</th>'+calPer().map((p,i)=>'<th>'+esc(p)+'</th>').join('')+'<th>Promedio</th></tr></thead><tbody>'+studs.map(a=>{const p=avg(calVals(a,s));return '<tr><td class="l">'+esc(fullName(a))+'</td>'+[1,2,3].map(t=>'<td>'+inp(a,s,t)+'</td>').join('')+'<td><b class="c'+calEst(p)+'">'+f1(p)+'</b></td></tr>'}).join('')+'</tbody></table></div>'
   :'<div class="twrap"><table class="calgrid"><thead><tr><th class="l">Alumno</th>'+L.map(x=>'<th title="'+esc(x)+'"><span>'+esc(x.length>12?x.slice(0,11)+'…':x)+'</span></th>').join('')+'<th>Promedio</th></tr></thead><tbody>'+studs.map(a=>{const p=avg(L.map(x=>calVals(a,x)[tr-1]));return '<tr><td class="l">'+esc(fullName(a))+'</td>'+L.map(x=>'<td>'+inp(a,x,tr)+'</td>').join('')+'<td><b class="c'+calEst(p)+'">'+f1(p)+'</b></td></tr>'}).join('')+'</tbody></table></div>';
  return calFiltros(true)+'<div class="panel"><h3>'+esc(gTxt(o.gr+o.gp))+' · '+esc(s||calPer()[tr-1])+' <span class="chip N">'+studs.length+' alumnos</span></h3><p class="sub">Escribe la calificación y pasa a la siguiente con Enter o Tab: se guarda al instante. Escala de 5 a '+f1(calMaxV())+'.</p>'+(studs.length?grid:'<div class="empty">No hay alumnos en este grupo.</div>')+'</div>'+calImportHTML();
}
function calImportHTML(){
  const o=U.cf;
  return '<div class="panel"><h3>Cargar desde Excel</h3><p class="sub">Descarga la plantilla del grupo (una columna por asignatura), llénala o pega las calificaciones de tu sistema y súbela. Se cargan al periodo elegido arriba.</p><div class="body actions"><button class="btn" data-act="cfTpl"'+(o.gr?'':' disabled')+'>Descargar plantilla de '+(o.gr?esc(o.gr+'°'+(o.gp||'')):'(elige grado)')+'</button><label class="btn" style="cursor:pointer">Cargar archivo de calificaciones<input type="file" id="cfFile" accept=".xlsx,.csv" hidden></label></div></div>';
}
function calAlumnoVista(){
  const o=U.cf,studs=activos().sort(cmpA),q=(o.q||'').toLowerCase(),L=studs.filter(a=>!q||(fullName(a)+' '+a.mat).toLowerCase().includes(q)).slice(0,300);
  const a=D.al[o.al]&&verAl(D.al[o.al])?D.al[o.al]:null;
  let h='<div class="cols2"><div class="panel"><h3>Alumnos</h3><div class="body"><input data-b="cf.q" data-live placeholder="Buscar por nombre o matrícula" value="'+esc(o.q||'')+'" style="width:100%;margin-bottom:6px"><select data-b="cf.al" size="14" style="width:100%;min-height:300px">'+L.map(x=>'<option value="'+x.id+'"'+(a&&a.id===x.id?' selected':'')+'>'+esc(fullName(x))+' · '+grp(x)+'</option>').join('')+'</select></div></div><div class="panel"><h3>'+(a?esc(fullName(a))+' <span class="note">'+grp(a)+(a.tec?' · '+esc(a.tec):'')+'</span>':'Elige un alumno')+'</h3><div class="body">';
  if(a){
    const c=calAlumno(a,'F'),e=nivCal(c);
    h+='<div class="stats" style="margin-bottom:10px"><div class="stat"><span>Promedio</span><b class="c'+calEst(c.prom)+'">'+f1(c.prom)+'</b></div><div class="stat"><span>Proyección final</span><b class="'+(c.proy!=null&&c.proy<calMinV()?'cF':'')+'">'+f1(c.proy)+'</b></div><div class="stat"><span>No aprobadas</span><b class="'+(c.repr.length?'cF':'')+'">'+c.repr.length+'</b></div><div class="stat"><span>Estado</span><b style="font-size:16px"><span class="chip '+e+'">'+nivCalTxt[e]+'</span></b></div></div>'+
     vzLineas([{n:'Promedio',vals:c.tri}],calPer(),{min:5,max:calMaxV(),refs:[{v:calMinV(),c:'F',t:'Mínimo'},{v:calAlertaV(),c:'R',t:'Alerta'}],aria:'Promedio del alumno por trimestre'})+
     '<div class="twrap"><table><thead><tr><th class="l">Asignatura</th>'+calPer().map((p,i)=>'<th>T'+(i+1)+'</th>').join('')+'<th>Promedio</th><th></th></tr></thead><tbody>'+c.L.map(s=>{const v=calVals(a,s),p=avg(v);return '<tr><td class="l">'+esc(s)+'</td>'+v.map(x=>'<td class="'+(x==null?'':'c'+calEst(x))+'">'+f1(x)+'</td>').join('')+'<td><b class="c'+calEst(p)+'">'+f1(p)+'</b></td><td>'+vzSpark(v)+'</td></tr>'}).join('')+'</tbody></table></div>'+
     '<div class="actions" style="margin-top:10px"><button class="btn" data-act="cfBoleta" data-id="'+a.id+'">Concentrado del alumno (PDF o Excel)</button>'+(verOculto('riesgo')&&editOculto('riesgo')?'<button class="btn" data-act="rsgAbrir" data-id="'+a.id+'">Alerta temprana</button>':'')+'</div>';
  }else h+='<p class="note">Elige un alumno de la lista para ver sus calificaciones de los tres trimestres, su tendencia y su proyección.</p>';
  return h+'</div></div></div>';
}
/* --- reportes de calificaciones (solo desde esta pestaña) --- */
function calRepConc(){
  const o=U.cf,tr=o.tr==='F'?'F':Number(o.tr),studs=calFilt();if(!studs.length)return {error:'No hay alumnos con estos filtros.'};
  const sheets=groupsOf(studs).map(g=>{const L=asigDe(g[0].gr);return {name:(String(g[0].gr)+g[0].gp).slice(0,31),title:'Grupo '+grp(g[0])+' · '+g.length+' alumnos',cols:[C('No.',.5,'c','n'),C('Alumno',3.2),...L.map(s=>C(s,.9,'c','n')),C('Promedio',1,'c','n'),C('Estado',1.6)],
    rows:g.map((a,i)=>{const c=calAlumno(a,tr);return [i+1,fullName(a),...L.map(s=>{const v=calV(a,s,tr);return v==null?'':Math.round(v*10)/10}),c.prom==null?'':Math.round(c.prom*10)/10,nivCalTxt[nivCal(c)]]}),foots:[]}});
  return {id:'calconc',title:'Concentrado de calificaciones',lines:[trTxt(tr),'Mínimo aprobatorio '+f1(calMinV())+' · alerta si es menor a '+f1(calAlertaV())],sheets,firmas:[['Elaboró',ME.nombre],['Vo. Bo. Dirección',D.cfg.resp||'']]};
}
function calRepAlerta(){
  const o=U.cf,tr=o.tr==='F'?'F':Number(o.tr),R=calFilt().map(a=>({a,c:calAlumno(a,tr)})).filter(x=>x.c.prom!=null&&nivCal(x.c)!=='P').sort((x,y)=>x.c.prom-y.c.prom);
  if(!R.length)return {error:'Ningún alumno en alerta con estos filtros.'};

  if(s&&tot(s)>=5&&pc!=null&&pc<D.cfg.umbralPct)L.push({c:'aca',n:'Asistencia baja: '+pc.toFixed(0)+'%',p:2});
  if(s&&s.F>=Math.max(3,(Number(D.cfg.umbralFaltas)||3)*2))L.push({c:'aca',n:'Faltas sin justificar en el ciclo: '+s.F,p:1});

/* leer un QR de una foto (no necesita permiso de cámara en vivo) */
async function qrDeFoto(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('No se pudo abrir la foto.'));i.src=url});
    let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
    if(det){try{const r=await det.detect(im);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}}
    if(!window.jsQR)await loadJsQR();
    if(!window.jsQR)throw new Error('No se pudo cargar el lector de QR. Revisa internet.');
    for(const max of [1000,1600,700]){
      const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,c.width,c.height);
      const q=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q&&q.data)return q.data;
    }
    throw new Error('No se encontró un código QR en la foto. Acércate más, con buena luz y sin reflejos.');
  }finally{URL.revokeObjectURL(url)}
}

  return {ok:r.ok,status:r.status,j};
}

  if(r.status===404){aviso('Creando el repositorio «'+rep+'»…');const c=await ghReq(tok,'POST','/user/repos',{name:rep,description:'Portal Académico SICET (app web sin datos)',private:false,auto_init:true});if(!c.ok)throw new Error('No se pudo crear el repositorio ('+c.status+'). Revisa los permisos del token.');await sleep(2500);r=await ghReq(tok,'GET','/repos/'+own+'/'+rep)}

  let man=MANIF();try{const m=JSON.parse(man);m.name=PORTAL_N+' SICET';m.short_name='Portal SICET';man=JSON.stringify(m)}catch(e){}
  const files=[['index.html',b64txt(t)],['manifest.webmanifest',b64txt(man)],['sw.js',b64txt(SW_TXT)],['README.md',b64txt('# '+PORTAL_N+' · SICET\n\nApp web de SICET (Sistema Integral de Control Escolar Técnico) para celulares Android, iPhone y iPad.\nNo contiene datos de alumnos ni claves: cada persona entra con su usuario y contraseña de su escuela.\n')],['.nojekyll','']];
  for(const [n,sz,mask] of [['icon-192.png',192],['icon-512.png',512],['icon-maskable-512.png',512,1],['apple-touch-icon.png',180,1]]){try{files.push([n,b64(await svgPng(iconoSVG(sz,!!mask),sz))])}catch(e){}}
  let i=0;
  for(const [n,c] of files){
    i++;aviso('Subiendo '+n+' ('+i+' de '+files.length+')…');
    const g=await ghReq(tok,'GET','/repos/'+own+'/'+rep+'/contents/'+n+'?ref='+rama),sha=g.ok&&g.j&&g.j.sha?g.j.sha:undefined;
    const p=await ghReq(tok,'PUT','/repos/'+own+'/'+rep+'/contents/'+n,Object.assign({message:'SICET '+ASX_VERSION+': '+n,content:c,branch:rama},sha?{sha}:{}));
    if(!p.ok)throw new Error('No se pudo subir '+n+' ('+p.status+'). El token necesita permiso de «Contents: Read and write».');
  }
  aviso('Activando GitHub Pages…');
  const pg=await ghReq(tok,'POST','/repos/'+own+'/'+rep+'/pages',{source:{branch:rama,path:'/'}});
  if(!pg.ok&&pg.status!==409&&pg.status!==422){const q=await ghReq(tok,'GET','/repos/'+own+'/'+rep+'/pages');if(!q.ok)throw new Error('Se subieron los archivos, pero no se pudo activar GitHub Pages ('+pg.status+'). Actívalo en el repositorio: Settings → Pages → rama '+rama+'.')}

/* ====== Calificaciones de los docentes: sus grupos y asignaturas, fecha límite, envío a Dirección y semáforo ====== */
/* - Cada docente captura solo las asignaturas que imparte (Ajustes → Personal → «Asignaturas que imparte») y solo a sus alumnos.
   - Dirección, Subdirección o el Administrador ponen la fecha y hora límite de cada trimestre. Una vez puesta, solo el Administrador la cambia.
   - Al terminar, el docente pulsa «Enviar a Dirección»: se bloquea. Dirección o Subdirección pueden devolverla con prórroga. */
const puedeCalLim=()=>esAdmGen()||(!!ME&&['admin','subdir'].includes(ME.rol));
const esTecAsig=s=>/^tecnolog/i.test(String(s||''));
const asigsU=u=>{if(!u)return [];const L=Array.isArray(u.asigs)?u.asigs.filter(Boolean):[];if(L.length)return L;return u.rol==='docentetec'?['Tecnología']:[]};
const meU=()=>(ME&&D.users[ME.id])||ME;
const calEsDoc=()=>!!ME&&!!ME.id&&(asigsU(meU()).length>0||['docente','docentetec'].includes(ME.rol));
const tecDeU=(u,a)=>!!a.tec&&(u.tecs||[]).some(k=>k==='*|'+a.tec||k===String(a.gr)+'|'+a.tec);
function calAlEnUnidad(u,a,s){
  if(!a||a.baja||!asigDe(a.gr).includes(s))return false;
  if(esTecAsig(s)&&(u.tecs||[]).length)return tecDeU(u,a);
  return (u.grupos||[]).map(String).includes(String(a.gr)+a.gp);
}
function calUnidades(u){
  const out=[];if(!u)return out;const base=Object.values(D.al).filter(a=>!a.baja);
  for(const s of asigsU(u)){
    const m=new Map();
    for(const a of base)if(calAlEnUnidad(u,a,s)){const g=String(a.gr)+a.gp;if(!m.has(g))m.set(g,[]);m.get(g).push(a)}
    [...m.keys()].sort((x,y)=>x.localeCompare(y,'es',{numeric:true})).forEach(g=>{const L=m.get(g).sort(cmpA);out.push({u:u.id,s,g,gr:L[0].gr,gp:L[0].gp,al:L})});
  }
  return out;
}
const envId=(tr,g,s)=>tr+'~'+g+'~'+s;
const calLims=()=>Object.assign({},D.cfg.calLim||{});
const limMs=tr=>{const v=calLims()[tr];if(!v)return 0;const t=new Date(v).getTime();return isNaN(t)?0:t};
const limTxt=tr=>{const v=calLims()[tr];return v?fechaLarga(v).replace(/\.$/,''):''};
/* ¿la unidad (tr, grupo, asignatura) está abierta para el docente en el momento ts? */
function calVentana(tr,g,s,ts){
  const env=(D.cenv||{})[envId(tr,g,s)];
  if(env&&env.aut)return 'Dirección ya autorizó esta lista: ya no se puede modificar.';
  if(env&&!env.dev)return 'Ya enviaste estas calificaciones a Dirección. Si necesitas corregir, pide que te las devuelvan.';
  const lim=limMs(tr);
  if(env&&env.dev&&env.hasta&&ts<=env.hasta)return '';
  if(!lim)return 'Dirección todavía no abre la captura del '+calPer()[tr-1]+'.';
  if(ts>lim)return 'La captura del '+calPer()[tr-1]+' se cerró el '+limTxt(tr)+'.';
  return '';
}
function calDocPuedeU(u,al,s,tr,ts){
  if(!u)return 'Tu cuenta no puede capturar calificaciones.';
  const a=D.al[al];if(!a)return 'Alumno no encontrado.';
  if(!asigsU(u).includes(s))return 'No tienes asignada la asignatura «'+s+'». Pide a Dirección que la agregue en tu cuenta.';
  if(!calAlEnUnidad(u,a,s))return 'Ese alumno no está en tus grupos.';
  return calVentana(Number(tr),String(a.gr)+a.gp,s,ts||Date.now());
}
/* --- autorización de Dirección: después ya nadie modifica esa lista --- */
const calAutAl=(al,s,tr)=>{const a=D.al[al];if(!a)return false;const e=(D.cenv||{})[envId(Number(tr),String(a.gr)+a.gp,s)];return !!(e&&e.aut)};
const nucleo=r=>r?JSON.stringify([r.u,r.tr,r.g,r.s,r.f||0,r.cap||0,r.tot||0]):'';
function calEnvGuard(op){
  const cur=(D.cenv||{})[op.id],nv=op.rec;
  if(!nv)return esAdministrador()?'':'Solo el Administrador puede borrar un registro de entrega.';
  if(cur&&cur.aut&&!nv.aut)return esAdministrador()?'':'Solo el Administrador puede reabrir una lista autorizada.';
  if(cur&&cur.aut&&nv.aut){
    if(nucleo(cur)!==nucleo(nv)||JSON.stringify(cur.aut)!==JSON.stringify(nv.aut))return 'Esa lista ya está autorizada.';
    return (can('calif_listas')||puedeCalLim())?'':'Tu cuenta no puede recibir listas de calificaciones.';
  }
  if(nv.aut)return puedeCalLim()?'':'Solo Dirección, Subdirección o el Administrador autorizan las listas.';
  if(nv.dev)return puedeCalLim()?'':'Solo Dirección, Subdirección o el Administrador pueden devolver calificaciones.';
  if(nv.u!==ME.id)return 'Solo el docente puede enviar sus calificaciones.';
  const un=calUnidades(meU()).find(x=>x.s===nv.s&&x.g===nv.g);if(!un)return 'Esa asignatura o grupo no está asignado a tu cuenta.';
  return calVentana(nv.tr,nv.g,nv.s,Date.now());
}

/* ====== Blindaje (seguridad reforzada) ======
   1. Nube v2: los datos de la escuela viven en /s/<código secreto derivado de la clave>. Con el enlace o el código de la
      escuela NADIE puede leer, copiar ni borrar los datos (antes bastaba conocer el identificador para descargarlos cifrados).
   2. Acceso de celulares v2: el sobre de cada persona está en una ruta que solo se calcula con su contraseña correcta:
      ya no se puede descargar para intentar adivinar contraseñas sin conexión.
   3. Renovar la clave de la nube: desconecta de golpe todos los celulares y computadoras (por ejemplo, si alguien deja la escuela).
   4. Intentos fallidos limitados también en el celular. Token de GitHub guardado cifrado con una llave del equipo.
   5. Panel «Seguridad» con el estado y las recomendaciones. */
const accId2=async(esc2,usuario,hash)=>sha256hex(_te.encode('acc2|'+esc2+'|'+String(usuario).trim().toLowerCase()+'|'+hash));
async function clGuardarNube(){await IDB.put('kv','nube',{url:CL.cfg.url,esc:CL.cfg.esc,pass:CL.cfg.pass||'',key:CL.key,sec:CL.cfg.sec||'',v2:!!CL.cfg.v2,salt:CL.cfg.salt||''})}
async function clMetaNueva(base,pass){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))),key=await claveSync(pass,salt,210000);
  const meta={app:'AsisteMX',v:2,salt,iter:210000,prueba:b64(await cifrar(_te.encode('AsisteMX'),key)),creado:new Date().toISOString()};
  const r=await fetchT(base+'/meta.json',{method:'PUT',body:JSON.stringify(meta)},15000);if(!r.ok)throw new Error('La nube rechazó la escritura ('+r.status+').');
  return {meta,key};
}
async function clRevocado(msg){
  clClose();const out=CL.out;CL.on=false;CL.cfg=null;CL.key=null;await IDB.put('kv','nube',null);
  bitacora('Conexión a la nube retirada: '+msg);
  if(EDITION==='movil'){CL.out=out;D=defaults();await IDB.put('kv','state',null);await IDB.clear('meta');META.clear();locked=true;showConectarM(msg+' Entra otra vez con tu usuario y contraseña.')}
  else{CL.out=[];await IDB.put('kv','clout',[]);toast(msg,'err');if(!locked)render()}
}
let CL_REGLAS='';/* '', 'ok' o 'viejas' */
async function clV2Revisar(){
  if(!CL.on||!CL.cfg)return;
  if(CL.cfg.v2&&CL.cfg.sec){
    const r=await fetchT(CL.cfg.url+'/s/'+CL.cfg.sec+'/meta.json',null,10000);if(!r.ok)return;const m=await r.json();
    if(!m||m.rev)return clRevocado(m&&m.rev?'La clave de la nube cambió.':'La conexión a la nube ya no es válida.');
    if(CL.cfg.salt&&m.salt&&m.salt!==CL.cfg.salt)return clRevocado('La clave de la nube cambió.');
    CL_REGLAS='ok';return;
  }
  if(EDITION==='movil'||!CL.cfg.pass){
    const r=await fetchT(CL.cfg.url+'/e/'+CL.cfg.esc+'/meta.json',null,10000);
    if(r.status===401||r.status===403)return clRevocado('La escuela reforzó la seguridad de su nube.');
    return;
  }
  const sec=await clSec(CL.cfg.pass,CL.cfg.esc),base=CL.cfg.url+'/s/'+sec;
  const r=await fetchT(base+'/meta.json',null,10000);
  if(!r.ok){CL_REGLAS=(r.status===401||r.status===403)?'viejas':'';return}
  let m=await r.json(),key,nueva=false;
  if(m&&m.rev)return clRevocado('La clave de la nube cambió. Conecta esta computadora con la clave nueva (Ajustes → Celulares).');
  if(m&&m.app==='AsisteMX'){key=await claveSync(CL.cfg.pass,m.salt,m.iter);try{if(_td.decode(await descifrar(unb64(m.prueba),key))!=='AsisteMX')throw 0}catch(e){return}}
  else{const x=await clMetaNueva(base,CL.cfg.pass);m=x.meta;key=x.key;nueva=true}
  const viejo=(await IDB.get('kv','accEnv'))||{};
  Object.assign(CL.cfg,{sec,v2:true,salt:m.salt});CL.key=key;await clGuardarNube();CL_REGLAS='ok';
  bitacora('Nube reforzada: los datos pasaron a la ruta secreta (v2)');
  clClose();clOpen();if(nueva)encolarNube();clFlush().catch(()=>{});
  for(const id of Object.keys(viejo))fetchT(CL.cfg.url+'/e/'+CL.cfg.esc+'/acc/'+id+'.json',{method:'DELETE'},8000).catch(()=>{});
  await IDB.put('kv','accEnv',{});accProgramar();
  if(!locked&&U.tab==='ajustes')render();
}
const _clStartS=clStart;
clStart=function(){if(!CL.on)return _clStartS();clV2Revisar().catch(()=>{}).finally(()=>{if(CL.on)_clStartS()})};

const _accSync1=accSync;
accSync=async function(){
  if(!CL.cfg||!CL.cfg.v2)return _accSync1();
  if(EDITION==='movil'||!CL.on||!CL.cfg.pass)return;
  const base=CL.cfg.url+'/e/'+CL.cfg.esc,env=(await IDB.get('kv','accEnv2'))||{},nuevo={};
  const conn=JSON.stringify({u:CL.cfg.url,e:CL.cfg.esc,p:CL.cfg.pass,k:(D.cfg.soporte||[])}),cf=(await sha256hex(_te.encode(conn))).slice(0,16);
  for(const u of Object.values(D.users)){
    if(!movilOk(u)||u.activo===false||!u.hash)continue;
    const uid=await accUid(u.usuario),id2=await accId2(CL.cfg.esc,u.usuario,u.hash),f=id2+'|'+cf+'|'+u.salt;nuevo[uid]={f,id:id2};
    if(env[uid]&&env[uid].f===f)continue;
    const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await accLlave(u.hash),_te.encode(conn)));
    let r=await fetchT(base+'/acc/'+id2+'.json',{method:'PUT',body:JSON.stringify({iv:b64(iv),c:b64(ct)})},15000);if(!r.ok)throw new Error('nube '+r.status);
    r=await fetchT(base+'/sal/'+uid+'.json',{method:'PUT',body:JSON.stringify({s:u.salt,i:u.iter})},15000);if(!r.ok)throw new Error('nube '+r.status);
    if(env[uid]&&env[uid].id!==id2)fetchT(base+'/acc/'+env[uid].id+'.json',{method:'DELETE'},10000).catch(()=>{});
  }
  for(const uid of Object.keys(env))if(!nuevo[uid]){try{await fetchT(base+'/sal/'+uid+'.json',{method:'DELETE'},10000);await fetchT(base+'/acc/'+env[uid].id+'.json',{method:'DELETE'},10000)}catch(e){}}
  await IDB.put('kv','accEnv2',nuevo);
};

async function accVerificar(){

/* --- entrar desde el celular (v2 primero, luego el método anterior) --- */
async function escResolver(escTxt){
  let p=null;const t=String(escTxt||'').trim(),mS=t.match(/s=([A-Za-z0-9_-]+)/);
  if(mS){try{p=JSON.parse(_td.decode(unb64u(mS[1])))}catch(e){}}
  if(!p){
    const code=t.toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4)throw new Error('Escribe el código de la escuela (te lo da Dirección).');
    const nube=window.__SICET_NUBE||'';if(!nube)throw new Error('Esta app no conoce la nube de la escuela. Abre el enlace que te mandó Dirección.');
    let j=null;try{const r=await fetchT(nube.replace(/\/+$/,'')+'/cod/'+code+'.json',null,12000);j=r.ok?await r.json():null}catch(e){throw new Error('Sin conexión a internet. Revisa tus datos o Wi-Fi.')}
    if(!j||!j.e)throw new Error('No existe una escuela con el código «'+code+'».');
    p={u:nube.replace(/\/+$/,''),e:j.e};
  }
  if(!p.u||!p.e||!/^[A-Za-z0-9_-]{4,64}$/.test(p.e)||!/^https?:\/\//.test(p.u))throw new Error('El enlace de la escuela no es válido.');
  return p;
}
const _entrar1=entrarConUsuario;
entrarConUsuario=async function(escTxt,usuario,pw){
  if(lkEspera())throw new Error(lkTxt());
  const malo=m=>{lkFalla();return new Error(lkEspera()?lkTxt():m)};
  const p=await escResolver(escTxt),uid=await accUid(usuario);let sal=null;
  try{const r=await fetchT(p.u+'/e/'+p.e+'/sal/'+uid+'.json',null,12000);sal=r.ok?await r.json():null}catch(e){throw new Error('Sin conexión a internet. Revisa tus datos o Wi-Fi.')}
  if(sal&&sal.s){
    const h=await hashPw(pw,sal.s,sal.i),id2=await accId2(p.e,usuario,h);let rec=null;
    try{const r=await fetchT(p.u+'/e/'+p.e+'/acc/'+id2+'.json',null,12000);rec=r.ok?await r.json():null}catch(e){throw new Error('Sin conexión a internet. Revisa tus datos o Wi-Fi.')}
    if(!rec||!rec.c)throw malo('Usuario o contraseña incorrectos.');
    let conn;try{conn=JSON.parse(_td.decode(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},await accLlave(h),unb64(rec.c)))))}catch(e){throw malo('Usuario o contraseña incorrectos.')}
    await clIniciar(conn.u,conn.e,conn.p,false);TRUST=Array.isArray(conn.k)?conn.k:[];await IDB.put('kv','trust',TRUST);lkOk();
    try{localStorage.setItem('sicet_esc',String(escTxt||'').trim());sessionStorage.setItem('sicet_u',String(usuario).trim().toLowerCase())}catch(e){}
    return true;
  }
  try{const r=await _entrar1(escTxt,usuario,pw);lkOk();return r}
  catch(e){if(/incorrectos/.test(e.message||''))throw malo(e.message);throw e}
};
/* --- renovar la clave de la nube --- */
async function clRenovar(nueva){
  if(!CL.on||!CL.cfg||!CL.cfg.v2||!CL.cfg.pass)throw new Error('Primero hay que reforzar la nube (reglas nuevas).');
  const url=CL.cfg.url,esc2=CL.cfg.esc,oldSec=CL.cfg.sec,sec=await clSec(nueva,esc2);
  const r0=await fetchT(url+'/s/'+sec+'/meta.json',null,10000);if(!r0.ok)throw new Error('La nube respondió '+r0.status+'.');if(await r0.json())throw new Error('Esa clave ya se usó antes. Elige otra.');
  const x=await clMetaNueva(url+'/s/'+sec,nueva);
  Object.assign(CL.cfg,{pass:nueva,sec,salt:x.meta.salt,v2:true});CL.key=x.key;await clGuardarNube();
  clClose();CL.out=[];encolarNube();await clFlush();clOpen();
  await fetchT(url+'/s/'+oldSec+'.json',{method:'DELETE'},20000).catch(()=>{});
  await fetchT(url+'/s/'+oldSec+'/meta.json',{method:'PUT',body:JSON.stringify({rev:Date.now()})},10000).catch(()=>{});
  await IDB.put('kv','accEnv2',{});await accSync();
  bitacora('Clave de la nube renovada: se desconectaron todos los celulares y equipos anteriores');
}
/* --- token de GitHub cifrado con una llave que no sale de este equipo --- */
async function devKey(){let k=await IDB.get('kv','devKey');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await IDB.put('kv','devKey',k)}return k}
async function devSeal(t){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await devKey(),_te.encode(t))))}
async function devOpen(s){try{const [iv,c]=String(s).split('.');return _td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},await devKey(),unb64(c)))}catch(e){return ''}}
ghCfg=async function(){
  const o=Object.assign({own:GH_OWN0,rep:GH_REP0,tok:''},(await IDB.get('kv','ghPub'))||{});
  if(o.tokE)o.tok=await devOpen(o.tokE);
  else if(o.tok){const raw=o.tok;await IDB.put('kv','ghPub',Object.assign({},o,{tok:'',tokE:await devSeal(raw)}));o.tok=raw}
  return o;
};
const _idbPutS=IDB.put.bind(IDB);
IDB.put=async function(n,k,v){if(n==='kv'&&k==='ghPub'&&v&&v.tok){v=Object.assign({},v,{tokE:await devSeal(v.tok),tok:''})}return _idbPutS(n,k,v)};

function perRango(tr){
  const c=D.cfg,hoy=todayISO(),P=c.calPerF||[],y1=Number(String(c.inicio).slice(0,4)),y2=y1+1;
  let a,b;

    for(const x of cells){const k=refRC(x.match(/r="([A-Z]+\d+)"/)[1]).c;if(!done&&k>c){out.push(cell);done=true}out.push(x)}
    if(!done)out.push(cell);return '<row r="'+r+'"'+at+'>'+out.join('')+'</row>'});

   '<label>Tablas debajo del Panel'+sel('kpiTablas',[['true','Mostrar (plegadas)'],['no','Ocultar']])+'</label>'+
   '</div><p class="note" style="padding:0 14px 12px">Con pastel o dona se muestra cómo se reparten las faltas o los reprobados; con barras y columnas, el porcentaje de cada grupo.</p></div>';
};

let _detPrint=[];

/* ====== KPI Global: concentrado de toda la escuela (pestaña oculta) ====== */
const verKpiGlob=()=>EDITION!=='movil'&&!!ME&&!!ME.id&&verOculto('kpiglob');
const _tabsW=tabsFor;
tabsFor=function(){const t=_tabsW();if(verKpiGlob()&&!t.some(x=>x[0]==='kpiglob')){const i=t.findIndex(y=>y[0]==='ajustes');const x=['kpiglob','KPI Global'];if(i<0)t.push(x);else t.splice(i,0,x)}return t};
const MESC=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function kpiGlobalDatos(){
  const c=D.cfg,hoy=todayISO(),ini=c.inicio,fin=hoy<c.fin?hoy:c.fin,mn=calMinV();
  const al=Object.values(D.al).filter(a=>!a.baja),bajas=Object.values(D.al).filter(a=>a.baja).length,ids=new Set(al.map(a=>a.id));
  const {S,T}=compute(ini,fin,a=>ids.has(a.id)),tA=sumO(Object.values(S));
  /* asistencia por mes */
  const M=new Map();Object.keys(T).sort().forEach(d=>{const k=d.slice(0,7);if(!M.has(k))M.set(k,{P:0,R:0,F:0,J:0});const o=M.get(k),x=T[d];o.P+=x.P;o.R+=x.R;o.F+=x.F;o.J+=x.J});
  const meses=[...M.entries()].map(([k,o])=>({l:MESC[Number(k.slice(5))-1]+' '+k.slice(2,4),v:pctO(o),tip:'<b>'+MESC[Number(k.slice(5))-1]+' '+k.slice(0,4)+'</b><br>Asistencia '+pct1(pctO(o))+'<br>'+(o.F+o.J)+' faltas · '+o.R+' retardos'}));
  /* calificaciones (anual con lo capturado) */
  const CA=new Map();al.forEach(a=>{const r=calAlumno(a,'F');if(r.prom!=null)CA.set(a.id,r)});
  const conCal=[...CA.values()],repr=conCal.filter(r=>r.prom<mn).length,prom=avg(conCal.map(r=>r.prom));
  /* conducta y seguimiento */
  const cond=Object.values(D.cond||{}).filter(r=>r&&r.d>=ini&&r.d<=fin),condAl={};cond.forEach(r=>{condAl[r.al]=(condAl[r.al]||0)+1});
  const CM=new Map();cond.forEach(r=>{const k=r.d.slice(0,7);CM.set(k,(CM.get(k)||0)+1)});
  const condMes=[...CM.entries()].sort().map(([k,n])=>({l:MESC[Number(k.slice(5))-1],v:n,tip:'<b>'+MESC[Number(k.slice(5))-1]+' '+k.slice(0,4)+'</b><br>'+n+' reportes'}));
  const rsgAct=Object.entries(D.rsg||{}).filter(([id,r])=>ids.has(id)&&r&&r.est!=='cer'&&r.est!=='cerrado');
  /* entrega de calificaciones del periodo abierto */
  const trA=typeof trAbierto==='function'?trAbierto():1;let listas=0,env=0,aut=0;
  Object.values(D.users).filter(u=>u.activo!==false&&asigsU(u).length).forEach(u=>calUnidades(u).forEach(un=>{listas++;const e=(D.cenv||{})[envId(trA,un.g,un.s)];if(e&&!e.dev)env++;if(e&&e.aut)aut++}));
  /* personal */
  const per=Object.values(D.users).filter(u=>u.activo!==false&&u.rol!=='administrador'),ausHoy=Object.values(D.per||{}).filter(r=>r&&r.a<=hoy&&(r.b||r.a)>=hoy).length;
  /* por grupo */
  const G=new Map();al.forEach(a=>{const k=String(a.gr)+a.gp;if(!G.has(k))G.set(k,{k,l:grp(a),gr:a.gr,n:0,H:0,M:0,P:0,R:0,F:0,J:0,cal:0,rep:0,sum:0,cond:0,rsg:0});const g=G.get(k);g.n++;g[a.sx==='H'?'H':'M']++;const s=S[a.id];if(s){g.P+=s.P;g.R+=s.R;g.F+=s.F;g.J+=s.J}
    const r=CA.get(a.id);if(r){g.cal++;g.sum+=r.prom;if(r.prom<mn)g.rep++}g.cond+=condAl[a.id]||0;if((D.rsg||{})[a.id]&&D.rsg[a.id].est!=='cer'&&D.rsg[a.id].est!=='cerrado')g.rsg++});
  const grupos=[...G.values()].sort((a,b)=>a.k.localeCompare(b.k,'es',{numeric:true})).map(g=>Object.assign(g,{asis:pctO(g),prom:g.cal?g.sum/g.cal:null,prep:g.cal?g.rep/g.cal*100:null}));
  return {al,bajas,tA,meses,conCal,repr,prom,cond,condAl,condMes,rsgAct,trA,listas,env,aut,per,ausHoy,grupos,hab:schoolDays(ini,fin).length,dias:Object.keys(T).length,ini,fin};
}
VIEWS.kpiglob=()=>{
  if(!verKpiGlob())return '<div class="empty">No tienes acceso a esta sección.</div>';
  const K=kpiGlobalDatos(),c=D.cfg,mn=calMinV(),asis=pctO(K.tA),punt=K.tA.P+K.tA.R?K.tA.P/(K.tA.P+K.tA.R)*100:null,pRep=K.conCal.length?K.repr/K.conCal.length*100:null;
  const estA=v=>v==null?'':v<c.umbralPct?'F':v<Math.min(99,c.umbralPct+5)?'R':'P',estR=v=>v==null?'':v>=15?'F':v>=5?'R':'P';
  const share=['pastel','dona'].includes(kp('kpiGraf'));
  const H=K.al.filter(a=>a.sx==='H').length,Mu=K.al.length-H;
  const porGrado=D.cfg.grados.map(g=>{const L=K.al.filter(a=>String(a.gr)===String(g));return {l:g+'°',v:L.length,n:L.length,tip:'<b>'+g+'° grado</b><br>'+L.length+' alumnos · '+L.filter(a=>a.sx==='H').length+' H · '+L.filter(a=>a.sx==='M').length+' M'}}).filter(x=>x.v);
  const repGrado=D.cfg.grados.map(g=>{const L=K.grupos.filter(x=>String(x.gr)===String(g)),cal=L.reduce((t,x)=>t+x.cal,0),rep=L.reduce((t,x)=>t+x.rep,0);return {l:g+'°',v:cal?rep/cal*100:0,n:rep,est:estR(cal?rep/cal*100:null),tip:'<b>'+g+'° grado</b><br>'+(cal?pct1(rep/cal*100)+' reprobados ('+rep+' de '+cal+')':'Sin calificaciones')}}).filter(x=>x.tip.indexOf('Sin')<0);
  const asisGrado=D.cfg.grados.map(g=>{const L=K.grupos.filter(x=>String(x.gr)===String(g)),o=sumO(L);const v=pctO(o);return {l:g+'°',v:v||0,n:o.F+o.J,est:estA(v),tip:'<b>'+g+'° grado</b><br>Asistencia '+pct1(v)}}).filter(x=>x.v);
  const atender=K.grupos.map(g=>{let s=0;if(g.asis!=null&&g.asis<c.umbralPct)s+=2;if(g.prep!=null&&g.prep>=15)s+=2;else if(g.prep!=null&&g.prep>=5)s++;if(g.cond>=g.n*0.3)s++;return Object.assign({},g,{s})}).sort((a,b)=>b.s-a.s||(b.prep||0)-(a.prep||0));
  const tabla='<table class="ktab"><thead><tr><th class="l">Grupo</th><th>Alumnos</th><th>H / M</th><th>Asistencia</th><th>Promedio</th><th>Reprobación</th><th>Reportes</th><th>Seguimiento</th></tr></thead><tbody>'+
   atender.map(g=>'<tr><td class="l"><b>'+esc(g.l)+'</b></td><td>'+g.n+'</td><td>'+g.H+' / '+g.M+'</td><td>'+(g.asis==null?'—':'<span class="chip '+estA(g.asis)+'">'+pct1(g.asis)+'</span>')+'</td><td>'+(g.prom==null?'—':'<b class="c'+calEst(g.prom)+'">'+f1(g.prom)+'</b>')+'</td><td>'+(g.prep==null?'—':'<span class="chip '+estR(g.prep)+'">'+pct1(g.prep)+'</span>')+'</td><td>'+g.cond+'</td><td>'+g.rsg+'</td></tr>').join('')+'</tbody></table>';
  return '<div class="head"><div><h2>KPI Global <span class="chip J">Confidencial</span></h2><p>Concentrado de toda la escuela · ciclo '+esc(c.ciclo||'')+' · del '+esc(fd(K.ini))+' al '+esc(fd(K.fin))+'. Los grupos aparecen ordenados del que más necesita atención al que menos.</p></div><div class="actions"><button class="btn" data-act="kgRep">Descargar concentrado (PDF o Excel)</button></div></div>'+
   kWrap('<div class="kgrid6">'+
    kCard({t:'Matrícula',v:K.al.length,sub:H+' H · '+Mu+' M'+(K.bajas?' · '+K.bajas+' bajas':'')})+
    kCard({t:'Asistencia del ciclo',v:pct1(asis),sub:K.dias+' de '+K.hab+' días con lista',ring:asis,est:estA(asis)})+
    kCard({t:'Puntualidad',v:pct1(punt),sub:K.tA.R+' retardos',ring:punt,est:punt==null?'':punt<85?'F':punt<93?'R':'P'})+
    kCard({t:'Aprobación',v:pRep==null?'—':pct1(100-pRep),sub:K.conCal.length?K.repr+' de '+K.conCal.length+' reprobados':'sin calificaciones',ring:pRep==null?undefined:100-pRep,est:estR(pRep)})+
    kCard({t:'Promedio general',v:f1(K.prom),sub:'anual (lo capturado)',est:K.prom==null?'':calEst(K.prom)})+
    kCard({t:'Reportes de conducta',v:K.cond.length,sub:(n3=>n3+(n3===1?' alumno':' alumnos')+' con 3 o más')(Object.values(K.condAl).filter(n=>n>=3).length),est:K.cond.length?'R':''})+
    kCard({t:'Alerta temprana',v:K.rsgAct.length,sub:K.rsgAct.length===1?'alumno en seguimiento':'alumnos en seguimiento',est:K.rsgAct.length?'R':''})+
    kCard({t:'Entrega de calificaciones',v:K.listas?Math.round(K.env/K.listas*100)+'%':'—',sub:esc(calPer()[K.trA-1])+': '+K.env+' de '+K.listas+' enviadas · '+K.aut+' autorizadas',ring:K.listas?K.env/K.listas*100:undefined})+
    kCard({t:'Personal',v:K.per.length,sub:K.ausHoy?K.ausHoy+' con permiso hoy':'nadie con permiso hoy'})+'</div>'+
   '<div class="kgrid2">'+
    kPanel('Asistencia por mes','% de asistencia de cada mes del ciclo.',K.meses.length?vzChart(K.meses,{tipo:'lineas',W:1000,H:240,fmt:pct1,min:Math.max(0,Math.floor(Math.min(...K.meses.map(x=>x.v||0))/10)*10-10),max:100,axf:v=>Math.round(v)+'%'}):'<div class="empty">Aún no hay listas en el ciclo.</div>',' kwide')+
    kPanel('Matrícula por grado','Alumnos activos.',vzChart(porGrado,{fmt:v=>String(v),share:true,u:'alumnos'}))+
    kPanel('Matrícula por sexo','Alumnos activos.',vzChart([{l:'Hombres',v:H,n:H},{l:'Mujeres',v:Mu,n:Mu}],{fmt:v=>String(v),share:true,u:'alumnos'}))+
    kPanel('Asistencia por grado',share?'Reparto de las faltas.':'% de asistencia.',vzChart(asisGrado,{fmt:pct1,max:100,share,u:'faltas'}))+
    kPanel('Reprobación por grado',share?'Reparto de los reprobados.':'% de alumnos reprobados.',vzChart(repGrado,{fmt:pct1,max:100,share,u:'reprobados',vacio:'Nadie reprobado.'}))+
    kPanel('Reportes de conducta por mes','Cantidad de reportes.',K.condMes.length?vzChart(K.condMes,{tipo:'columnas',fmt:v=>String(v)}):'<div class="empty">Sin reportes en el ciclo.</div>')+
    kPanel('Concentrado por grupo','Asistencia, calificaciones, conducta y alumnos en seguimiento.',tabla,' kwide')+
   '</div>');
};
ACT.kgRep=()=>{
  const K=kpiGlobalDatos(),asis=pctO(K.tA),r1=v=>v==null?'':Math.round(v*10)/10;
  reportModal({id:'kpiglob',title:'KPI Global de la escuela',lines:['Ciclo '+(D.cfg.ciclo||'')+' · del '+fd(K.ini)+' al '+fd(K.fin),'Confidencial: uso interno de la escuela'],sheets:[
    {name:'Resumen',title:'Indicadores generales',cols:[C('Indicador',3),C('Valor',1.6,'c')],rows:[['Matrícula activa',K.al.length],['Bajas',K.bajas],['Asistencia del ciclo (%)',r1(asis)],['Retardos',K.tA.R],['Faltas (incluye justificadas)',K.tA.F+K.tA.J],['Alumnos con calificaciones',K.conCal.length],['Alumnos reprobados (promedio < '+f1(calMinV())+')',K.repr],['Promedio general',r1(K.prom)],['Reportes de conducta',K.cond.length],['Alumnos en alerta temprana',K.rsgAct.length],['Listas de calificaciones enviadas ('+calPer()[K.trA-1]+')',K.env+' de '+K.listas],['Listas autorizadas',K.aut],['Personal activo',K.per.length]],foots:[]},
    {name:'Por grupo',title:'Concentrado por grupo',cols:[C('Grupo',1,'c'),C('Alumnos',1,'c','n'),C('Hombres',1,'c','n'),C('Mujeres',1,'c','n'),C('Asistencia %',1.2,'c','n'),C('Promedio',1,'c','n'),C('Reprobación %',1.3,'c','n'),C('Reportes',1,'c','n'),C('Seguimiento',1.1,'c','n')],
     rows:K.grupos.map(g=>[g.l,g.n,g.H,g.M,r1(g.asis),r1(g.prom),r1(g.prep),g.cond,g.rsg]),foots:[]}]});
};

boot();

<script>
(function(){
 var EMB='4.6.3',ED='movil';
 function cmp(a,b){a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(var i=0;i<3;i++){var d=(a[i]||0)-(b[i]||0);if(d)return d>0?1:-1}return 0}
 function exec(id){var n=document.getElementById(id);if(!n)return;var s=document.createElement('script');s.textContent=n.textContent;document.head.appendChild(s)}
 function run(){['asx-qr','asx-app'].forEach(exec)}
 try{exec('asx-pako')}catch(e){}
 function open(){return new Promise(function(res,rej){var r=indexedDB.open('asistemx',1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
 function get(db,k){return new Promise(function(res,rej){var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
 function put(db,k,v){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)}})}
 async function gunz(u8){if(typeof DecompressionStream==='undefined'){if(window.pako)return window.pako.ungzip(u8);throw new Error('sin descompresor')}var ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(u8).catch(function(){});w.close().catch(function(){});return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
 async function sha(u8){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',u8)),function(b){return b.toString(16).padStart(2,'0')}).join('')}
 function ub(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
 async function descartar(db,o,bad,txt){bad.push(o.ver);await put(db,'updBad_'+ED,bad);var pv=await get(db,'updPrev_'+ED);await put(db,'upd_'+ED,(pv&&pv.ver&&pv.ver!==o.ver&&cmp(pv.ver,EMB)>0&&bad.indexOf(pv.ver)<0)?pv:null);await put(db,'updMsg',{t:txt})}
 async function elegir(){
  if(!window.crypto||!crypto.subtle||!window.indexedDB)return null;
  var db=await open(),o=await get(db,'upd_'+ED);
  if(!o||!o.gz||!o.ver||cmp(o.ver,EMB)<=0)return null;
  var bad=(await get(db,'updBad_'+ED))||[];if(bad.indexOf(o.ver)>=0)return null;
  var t=await get(db,'updTry_'+ED),n=(t&&t.ver===o.ver&&!t.ok)?(t.n||1)+1:1;
  if(n>2){await descartar(db,o,bad,'La actualización '+o.ver+' no pudo iniciar y se desactivó. Se usa la versión anterior.');return elegir()}
  var html=null;try{html=await gunz(o.gz)}catch(e){html=null}
  if(!html&&typeof DecompressionStream==='undefined'&&!window.pako)return null;
  var okh=!!html&&(await sha(html))===o.sha&&String(o.msg).indexOf(o.sha)>=0&&String(o.msg).indexOf('\n'+o.ver+'\n')>=0;
  if(okh){try{var k=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:o.x,y:o.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify']);okh=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,ub(o.sig),new TextEncoder().encode(o.msg))}catch(e){okh=false}}
  if(!okh){await descartar(db,o,bad,'La actualización '+o.ver+' estaba dañada y se descartó. Se usa la versión anterior.');return elegir()}
  await put(db,'updTry_'+ED,{ver:o.ver,n:n,ok:false});
  return new TextDecoder().decode(html);
 }
 var go=function(){elegir().then(function(h){if(h){document.open();document.write(h);document.close()}else run()}).catch(function(){run()})};
 go();
})();

</script>
